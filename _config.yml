# Site settings
title: Deepmosaic
# TICKET-SITE-31: 「モザイク処理」は日本語として方向 (かける/外す) を含まないため、
# 「かける」で確定させた。この値は jekyll-feed の feed.xml に出る。
description: "動画に映った対象をAIが自動検出してモザイクをかけるWindows向けデスクトップアプリケーション"
url: "https://www.deepmosaic.co.jp"
baseurl: ""
lang: ja

# Build settings
markdown: kramdown

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CHANGELOG.md
  - CLAUDE.md
  - LICENSE
  - .claude
  - .serena
  - node_modules
  - vendor
  - src
  - package.json
  - package-lock.json
  - vite.config.js
  - docs_draft # T-254: 作業メモを _site に複製しない
  # T-286: E2E は公開物ではない。除外しないと spec / 設定が _site に複製されて配信される
  - e2e
  - playwright.config.ts
  # T-2199 (i18n1112): サイトの多言語化の道具と用語集の写しを公開しない
  # T-2210 (i18n1112 ウェーブ末尾の追い修正): scripts/ の全部 (check-docs・check-plan-catalog・optimize-images も) を公開しない。
  # どのページ・css・js・sitemap・llms からも参照されていない (2026-11-12 に _site を走査して確認)
  - scripts

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: default
      # T-2199 (i18n1112): ja のページの言語。英中のページは front matter に lang: en / zh-tw を直接書く
      # (path: "en" の defaults は enterprise/ にも前方一致で当たるので置かない)
      lang: ja
