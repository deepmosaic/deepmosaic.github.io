# Site settings
title: Deepmosaic
# TICKET-SITE-31: 「モザイク処理」は日本語として方向 (かける/外す) を含まないため、
# 「かける」で確定させた。この値は jekyll-feed の feed.xml に出る。
description: "動画に映った対象をAIが自動検出してモザイクをかけるWindows向けデスクトップアプリケーション"
url: "https://www.deepmosaic.co.jp"
baseurl: ""
lang: ja

# Build settings
markdown: kramdown

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CHANGELOG.md
  - CLAUDE.md
  - LICENSE
  - .claude
  - .serena
  - node_modules
  - vendor
  - src
  - package.json
  - package-lock.json
  - vite.config.js

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: default
