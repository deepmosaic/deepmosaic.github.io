# FAQ (TICKET-SITE-03)
#
# 表示本体 (_includes/faq.html) と FAQPage JSON-LD (_includes/schema/faq.html) を
# **この 1 ファイルから生成する**。表示と構造化データが食い違うのは Google の
# ガイドライン違反であり、二重管理では必ずズレる。
#
# 注意: Google は 2023 年に FAQ リッチリザルトを政府・医療系サイトに限定した。
#       一般サイトでは表示されない。害はないので出すが、SEO 上の実効性があるのは
#       Product/Offer・BreadcrumbList・Article の 3 つ。優先順位を間違えないこと。
#
# ⚠️ 回答は **実装されている範囲** で書く。未実装機能を前提にした回答を書かない。

# ── TICKET-SITE-27: 誤認の訂正 ────────────────────────────────────────
# 「モザイクを *除去* するソフト」と誤認して DL するユーザーが後を絶たない。
# **この 2 件は配列の先頭に固定する。** 表示の 1・2 番目になると同時に
# FAQPage JSON-LD の mainEntity[0]/[1] になり、LLM は前方の要素を優先的に拾う。
# 位置そのものが設計判断なので並べ替えないこと。
#
# 肯定 (何をするソフトか) → 否定 (除去はできない) の順にするのは、否定から
# 始めるとページが弁明調になるため。
#
# ⚠️ 2 件目の質問文は **サイト全体で「除去」を使う唯一の箇所**
#    (/mosaic-removal/ を除く)。ユーザー自身が Ctrl+F や検索窓に打つ語に
#    一致させる必要があるのでここだけは例外。回答文では「取り除く」を使う。
#    語彙ポリシーの全体像は _data/entity.yml のコメントを参照。
#
# ⚠️ 「今後も提供する予定はありません」は方針の言明。曖昧にすると「将来できる
#    ようになるかも」と解釈される。方針が変わるなら _data/entity.yml の
#    `cannot` と両方を直すこと。
- q: "Deepmosaic はどのようなソフトですか？"
  a: "動画内の対象を AI が自動で検出・追跡し、その範囲にモザイクをかける Windows 向けのデスクトップアプリです。検出結果は編集画面で確認・修正でき、モザイクを焼き込んだ動画の書き出しと、Adobe Premiere Pro へのモザイク情報のインポートに対応しています。モザイク処理が必要な映像制作の現場で、提出前の作業を効率化する用途を想定しています。"

- q: "モザイクを除去することはできますか？"
  a: "できません。Deepmosaic は映像にモザイクをかける（付加する）ためのソフトウェアで、すでにモザイクや修正が入っている映像を元の状態に戻す機能はありません。今後この機能を搭載する予定もありません。AI が行うのは対象の位置を検出することまでで、その範囲にモザイクを重ねて出力します。"

- q: "映像は本当に外部に送信されないのですか？"
  a: "はい。AI 検出・編集・書き出しはすべてお使いの PC 内で完結します。映像・音声・フレーム画像・検出結果の座標・ファイル名は一切送信しません。初回セットアップ後はネットワークを切断した状態でも動作するので、ご自身で確認していただけます。送信するデータの一覧は「通信内容の開示」に掲載しています。"

- q: "審査に通ることは保証されますか？"
  a: "保証はできません。審査は各団体の判断であり、当社が関与できるものではないためです。本ソフトウェアは粒度や隠蔽率を設定として提供し、検出漏れの確認作業を効率化するものです。最終的な確認と表現に関する責任は制作者に帰属します。"

- q: "検出漏れがあった場合はどうなりますか？"
  a: "検出結果はすべて編集画面で確認・修正できます。検出枠の追加・削除・移動、モザイクの粒度変更、検出が途切れたフレームへのジャンプ（キーボードの [ と ]）に対応しています。AI が苦手なケース（極端な逆光、激しいブレ、部分的な遮蔽など）は「苦手なケースと制限事項」に公開しています。"

# TICKET-SITE-27: 編集ワークフローの質問なので「検出漏れ」の直後が文脈上の定位置。
# 「やり直せる」と「焼き込み後は戻せない」の線引きを 1 件で示す。
- q: "一度かけたモザイクを後から外せますか？"
  a: "アプリ内のプロジェクトであれば、モザイクの範囲・粒度・種類はいつでも変更して書き出し直せます。同じ素材なら何度でもやり直せます。書き出しは新しいファイルとして保存され、保存先は書き出しのたびに指定するため、元の動画に自動で上書きされることはありません。ただし、焼き込んで書き出した動画そのものからモザイクを取り除くことはできません。"

- q: "処理にはどのくらい時間がかかりますか？"
  a: "GPU の性能と素材の解像度に大きく依存します。本番環境の実測では、1080p の素材で動画長の 2〜6 倍程度が中央値です（RTX 4060 で約 2 倍、RTX 4070 Ti で約 3 倍、RTX 3070 Ti で約 6 倍）。GPU が無い場合は約 13 倍かかるため長尺には適しません。処理中はアプリを操作する必要がなく、完了後に確認作業から再開できます。詳しい実測値は動作環境ページに掲載しています。"

- q: "無料で使えますか？"
  a: "はい。無料で累計 6 時間分までの動画インポートがご利用いただけます。クレジットカードの登録は不要です。クレジットカードを登録しなければ Free プランのままご利用いただけるため、別途の無料トライアル期間は設けていません。無料分が終了した後も、既存プロジェクトの編集と書き出しは続けてご利用いただけます。"

# TICKET-SITE-20: 3 プラン化にあわせて追加。**プランの条件だけを書く** —
# 月額キャップやインポート前の金額提示はアプリ側で未実装なので触れない。
- q: "上限時間を超えたら処理は止まりますか？"
  a: "進行中の処理は止まりません。上限を超えた分は超過単価（Light は 1 時間あたり ¥800、Pro は ¥500、Enterprise は ¥300）で継続してご利用いただけます。プランごとの込み時間と超過単価は料金ページに掲載しています。なお上限時間と超過課金の適用は順次開始し、開始日は事前にお知らせします。"

- q: "GPU は必須ですか？ Mac には対応していますか？"
  a: "AI 検出は CPU のみでも動作しますが、処理速度が大幅に低下します（実測で約 2 fps）。快適にご利用いただくには NVIDIA CUDA 対応 GPU を推奨します。macOS 版は開発中で、提供時期は未定です。現時点では Windows 10 / 11（64 ビット）のみのご提供となります。"

- q: "どの Adobe 製品と連携できますか？"
  a: "Adobe Premiere Pro に対応しています。AI 検出したモザイク情報を Premiere Pro のプロジェクトへワンクリックでインポートできます。プラグインのセットアップもアプリが自動で案内します。モザイクを焼き込んだ動画の書き出しはアプリ内でも完結します。"

- q: "アプリのアップデートはどうすればよいですか？"
  a: "起動時に自動で新しいバージョンを確認し、更新がある場合はダイアログでお知らせします。ワンクリックで更新できます。"

- q: "解約はいつでもできますか？"
  a: "はい。有料プランはいつでも解約可能です。違約金等は一切ありません。解約は決済ポータルから行えます。"
