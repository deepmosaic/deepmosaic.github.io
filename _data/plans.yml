# 料金プランの単一の出所。料金カード / Free 帯 / ROI 計算機 / JSON-LD の AggregateOffer /
# HERO の無料枠の表記 / CTA ブロック / llms-full.txt が参照する。
# 値は料金のカタログと同じにする (scripts/check-plan-catalog.mjs が突き合わせる)。
#
#   display            card = 料金カード / strip = カード下の横帯 (Free)
#   included_basis     cumulative = 累計 (Free) / monthly = 月次 / pooled = アカウント数で共有
#   included_hours     included_basis が pooled のときは 1 アカウントあたりの時間
#   max_contracts      同じプランを重ねて契約できる本数の上限 (1 = 追加契約なし)。本数を書くのはここだけで、
#                      料金カードの「追加契約」行 / FAQ / docs はこの値から Liquid で組み立てる。
#                      合計時間は included_hours × max_contracts で求め、どこにも手書きしない
#   overage_per_hour   超過 1 時間あたりの単価。全プラン null (ROI 計算機 src/lib/pricing.js が参照するキー)
#   carryover_hours    未使用分の翌月繰越の上限。全プラン null
#   price_incl_display 税込額の写し (Liquid に桁区切りが無いため)。規則は src/lib/pricing.js の taxIncluded
#   specs              カード内の「ラベル | 値」行。「追加契約」行は書かない (max_contracts から組み立てる)
#   public             false のプランは料金カード・申し込みのページ・ROI 計算機に出さない
#                      public: false のプランと quote_label のあるプランは price / price_display /
#                      price_incl_display / price_unit を持たない
#   subscribe          あると申し込みのページ (/subscribe/#plan-<code>) にそのプランの申し込みボタンを出す
#   cta                料金カードのボタン。kind: download は Microsoft Store のインストーラを直接ダウンロードする文字のボタン
#                      (文は label)、kind: link は href へのボタン
#   quote_label        あると料金カードは金額・単位・税の代わりにこれを出し、直下に quote_note を出す
#   note_title / note  料金カードの囲み (見出し + 本文)

currency: "JPY"
currency_symbol: "¥"
tax_note: "税別"
tax_rate_percent: 10

rollout_note: ""

tiers:
  - code: free
    name: "Free"
    display: strip
    price: 0
    price_display: "0"
    included_hours: 2
    included_basis: "cumulative"
    free_window_days: 7
    max_contracts: 1
    overage_per_hour: null
    trial_days: 0
    featured: false
    public: true
    summary: "まずは無料で試せます"
    bullets:
      - "初めて起動した日から 7 日間、累計 2 時間分の動画インポートが無料（登録なしは 30 分）"
      - "7 日間か累計 2 時間のどちらか早い方で無料期間は終わります"
      - "1 台の PC では合計 2 時間まで（アカウントを作り直しても同じ）"
      - "クレジットカードの登録は不要"
      - "無料期間の終了後も、既存プロジェクトの編集・書き出しは続けてご利用いただけます"

  - code: light
    name: "HOBBY"
    display: card
    price: 2980
    price_display: "2,980"
    price_incl_display: "3,278"
    price_unit: "/ 月"
    included_hours: 5
    included_basis: "monthly"
    max_contracts: 1
    overage_per_hour: null
    carryover_hours: null
    trial_days: 0
    featured: true
    public: true
    summary: "同人・個人撮影のクリエイター向け。月 1〜3 本のペースに合わせた枠です。"
    specs:
      - label: "込み時間"
        value: "月 5 時間"
      - label: "同時起動"
        value: "1 台"
      - label: "支払方法"
        value: "クレジットカード"
    cta:
      label: "アプリをダウンロード"
      kind: "download"
    subscribe:
      label: "申し込む"

  - code: pro
    name: "Pro"
    display: card
    included_hours: 20
    included_basis: "monthly"
    max_contracts: 2
    overage_per_hour: null
    carryover_hours: null
    trial_days: 0
    featured: false
    public: false
    summary: "フリーランス編集者・専業に近い個人向け。"
    specs:
      - label: "込み時間"
        value: "月 20 時間"
      - label: "同時起動"
        value: "1 台"
      - label: "支払方法"
        value: "クレジットカード"
      - label: "解約"
        value: "いつでも可能・違約金なし"
    cta:
      label: "アプリをダウンロード"
      kind: "download"
    subscribe:
      label: "申し込む"

  - code: enterprise
    name: "Enterprise"
    display: card
    quote_label: "お見積り"
    quote_note: "ご利用規模・運用形態に応じて個別にご案内します"
    included_hours: 20
    included_basis: "pooled"
    min_seats: 1
    max_contracts: 1
    overage_per_hour: null
    carryover_hours: null
    trial_days: 0
    featured: false
    public: true
    summary: "メーカー・ポストプロダクション向け。1 アカウントから。"
    specs:
      - label: "込み時間"
        value: "アカウント数 × 20 時間をプール共有"
      - label: "請求"
        value: "ご利用月ごとに請求書を発行"
      - label: "支払方法"
        value: "請求書払い（銀行振込）"
    note_title: "API 利用・システム組み込み"
    note: "API 経由でのご利用や、御社のシステム・サービスへの組み込みをご希望の場合も、こちらからご相談ください。"
    cta:
      label: "導入について相談する"
      kind: "link"
      href: "/enterprise/inquiry/"
      external: false
