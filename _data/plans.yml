# 料金プランの単一真実源 (TICKET-SITE-03 → TICKET-SITE-20)
#
# ここを唯一の出所にして、料金カード / Free 帯 / ROI 計算機 / JSON-LD の AggregateOffer /
# HERO の無料枠表記 / CTA ブロック の全部から参照する。料金改定が 1 ファイルで済む。
#
# Claude Design の成果物は料金を **料金カードの markup と renderVals() の計算ロジックの
# 2 箇所にハードコード**していた。必ず片方だけ更新されて破綻するので、その構造は移植しない。
#
# ── TICKET-SITE-20: 2 プラン → 3 プラン + Free 帯 ─────────────────────────
#
# ⚠️ **従量課金 (超過課金) は全面廃止した**。Supabase `plan_catalog` の超過単価 /
#    Stripe 価格 ID / メーター名は null 化済みで、Stripe 側の従量 price も archive、
#    メーターも deactivate 済み。**¥800 / ¥500 / ¥300 という単価はもう存在しない**ので、
#    金額を書き戻さないこと (実在しない料金の広告になる)。
#
# ⚠️ アプリ側の課金実装 (front の TICKET-BILL 群) は Phase 0 のみ完了しており、
#    **上限時間はまだ強制されていない**。この事実の開示先は `_data/faq.yml` の
#    「上限に達したらどうなりますか」と `/docs/#plan` の 2 箇所。料金カード直下の
#    `rollout_note` は 2026-08-08 に空にした (下の該当行を参照)。
#
#    枠が足りない場合に同じプランを追加契約できる方式 (本数は各 tier の
#    `max_contracts`) は **2026-08-02 に提供開始**。Worker (deepmosaic-auth0-updater)
#    をデプロイ済みで、Checkout セッションに `adjustable_quantity` が付くため、
#    **出荷済みの v2.1.0 のアプリからでも Stripe の決済画面上で本数を増やせる**。
#    アプリ内の本数セレクタ (PlanSelectDialog) は UX 改善であってゲートではないので、
#    アプリの再出荷を待たずに「できます」と書いてよい。
#
#    「同時起動 1 台」は device_lock で既に強制済みなので注記の対象外。
#
# ⚠️ Free の `included_hours` は **6 のまま**にしている。新デザインの既定値は 3 だが、
#    アプリの `auth/env.rs::FREE_USAGE_LIMIT_SECONDS` は 6h を強制しており、3 と書くと
#    実際の挙動と食い違う。3h 化は front 側の切替と同時に行う。

# 表示通貨と税表記 (全プランで共通)
currency: "JPY"
currency_symbol: "¥"
tax_note: "税別"

# 料金カード直下に出る注記。**空文字にすると注記が出ない** (出し先は
# `_includes/pricing-cards.html` の 1 箇所で、トップと `/price/` の両方に効く)。
#
# 2026-08-08 に空にした。内容 (上限時間の適用開始 / 超過料金なし / 追加契約 /
# 既存契約の据え置き) は `_data/faq.yml` の「上限に達したらどうなりますか」と
# `/docs/#plan` が同じことを書いており、料金カードの直下に 3 つ目の複製を置いて
# いる状態だった。**開示が消えたわけではない**ので、注記を戻す前にまず
# その 2 箇所で足りているかを確認すること。
#
# ⚠️ 文面はアプリ `PlanSelectDialog.svelte` の注記と一字一句同じにしてあった。
#    復活させるならアプリ側と突き合わせる (片方だけ直すと説明が食い違う)。
rollout_note: ""

# 既存 Pro (無制限) 据え置きの注記 (`grandfather_note`) は削除した。
# 出す先だった `_includes/pricing-cards.html` の `grandfather` パラメータと
# `/price/` 側の受け渡しも同時に撤去してある。復活させるなら 3 箇所とも戻すこと。
# なお front 側の `from_legacy_plan_name` (既存の有料文字列を無制限に倒す実装) は
# **そのまま生きている**。消したのは告知だけで、据え置きの挙動ではない。

# プラン定義。
#
#   display          card = 3 枚並ぶ料金カード / strip = カード下の横帯 (Free)
#   included_basis   cumulative = 累計 (Free) / monthly = 月次 / pooled = シート共有
#   included_hours   included_basis が pooled のときは 1 シートあたりの時間
#   max_contracts    同じプランを重ねて契約できる本数の上限 (1 = 追加契約なし)。
#                    ⚠️ **Supabase `plan_catalog.max_contracts` が真の SSOT。ここは
#                    サイト用の写しで、CI が突き合わせる。** 静的サイトは Supabase を
#                    読めないため写しを置くしかない。乖離したら CI が落ちる
#                    (`scripts/check-plan-catalog.mjs`。込み時間 / 月額 / 最低シート数も
#                    同時に突き合わせる。Supabase に到達できないときは素通しする —
#                    デプロイを外部サービスの可用性に縛らないため)。
#                    front の `src/lib/plan/contract-options.ts` は「コードに数値を
#                    ハードコードしてはならない」と定めており、アプリは catalog から
#                    本数を引く。**サイト内で本数を書いてよいのはここだけ** —
#                    料金カードの「追加契約」行 / FAQ / docs は全てこの値から
#                    Liquid で組み立てる (TICKET-SITE-CONTRACT-SSOT)。
#                    込み時間の合計は `included_hours × max_contracts` で導出できるので
#                    **合計時間はどこにも手書きしない**
#   overage_per_hour 超過 1 時間あたりの単価。**従量課金の廃止により全プラン null**。
#                    ROI 計算機 (src/lib/pricing.js) が参照するのでキーは残す
#   specs            カード内の「ラベル | 値」行。デザインのカード仕様をそのまま持つ。
#                    ⚠️ **「追加契約」行はここに書かない** — `max_contracts` から
#                    `_includes/pricing-cards.html` が組み立てる (本数と合計時間を
#                    静的な文字列で持つと、Supabase の改定で必ず古くなるため)
tiers:
  - code: free
    name: "Free"
    display: strip
    price: 0
    price_display: "0"
    # 累計 (月次リセットではない)。front `auth/env.rs::FREE_USAGE_LIMIT_SECONDS` = 5h と一致
    # (T-013 で 6h→5h)。**Supabase の `plan_catalog.included_minutes` が正**で、
    # `src/lib/plan-catalog.test.js` が CI で突き合わせる (ローカルでは skip される)
    included_hours: 5
    included_basis: "cumulative"
    max_contracts: 1 # 無料プランは追加契約の対象外
    overage_per_hour: null # 従量課金なし (無料枠を使い切ったら有料プランへ)
    trial_days: 0
    featured: false
    public: true
    summary: "まずは無料で試せます"
    bullets:
      - "累計 5 時間分の動画インポート（登録なしは 3 時間）"
      - "クレジットカードの登録は不要"
      - "無料分の終了後も既存プロジェクトの編集・書き出しは継続できます"
    cta:
      label: "無料でダウンロード"
      kind: "download"

  - code: light
    name: "Light"
    display: card
    price: 2980
    price_display: "2,980"
    price_unit: "/ 月"
    included_hours: 5
    included_basis: "monthly"
    max_contracts: 3
    overage_per_hour: null # 従量課金は廃止 (旧 ¥800 / 時間)
    # 未使用分の翌月繰越の上限 (時間)。**繰越は廃止 (2026-08-02)。全プラン null**。
    # Supabase `plan_catalog.carryover_max_minutes` は sandbox / live とも 0 に更新済み
    # (出荷済みアプリのパース互換のため列自体は残置)。時間を書き戻さないこと
    carryover_hours: null
    trial_days: 0
    featured: false
    public: true
    summary: "同人・個人撮影のクリエイター向け。月 1〜3 本のペースに合わせた枠です。"
    specs:
      - label: "込み時間"
        value: "月 5 時間"
      # 「追加契約」行はここに書かない。`max_contracts` から pricing-cards.html が
      # 込み時間の直後に差し込む (本数・合計時間の手書きを排除するため)。
      - label: "同時起動"
        value: "1 台"
      # 支払方法は 3 プランとも明示する (T-252)。ラベルは Enterprise の行と同じ表記 (「支払方法」)。
      - label: "支払方法"
        value: "クレジットカード"
    cta:
      label: "ダウンロードして申し込む"
      kind: "download"
      # Pro (featured) を主ボタンにして視線を集めるため、Light は副ボタン配色にする
      variant: "secondary"

  - code: pro
    name: "Pro"
    display: card
    price: 9800
    price_display: "9,800"
    price_unit: "/ 月"
    # T-297 (2026-09-19): 月 40 時間 → 20 時間。真の SSOT は Supabase
    # `plan_catalog.included_minutes` (1200 分)。値を変えるときは必ず両方を同時に。
    included_hours: 20
    included_basis: "monthly"
    max_contracts: 2
    overage_per_hour: null # 従量課金は廃止 (旧 ¥500 / 時間)
    carryover_hours: null
    # 無料トライアルは設けない。クレジットカードを登録しなければ全員が Free プランとして
    # 使えるので、試用期間を別に用意する意味がない (かつ再トライアルの穴も作らない)。
    trial_days: 0
    featured: true
    # カード左上のバッジ (新デザイン準拠)。空なら出さない。
    badge: "最も選ばれています"
    public: true
    # 実効単価 (¥245 / 時間) の表記は削除した。込み時間を「使い切った場合」という
    # 最良ケースの単価で、実際にそこまで使うユーザーは限られるため誤解を招く。
    summary: "フリーランス編集者・専業に近い個人向け。"
    specs:
      - label: "込み時間"
        value: "月 20 時間"
      # 「追加契約」行は `max_contracts` から自動で入る (light の specs のコメントを参照)。
      - label: "同時起動"
        value: "1 台"
      - label: "支払方法"
        value: "クレジットカード"
      - label: "解約"
        value: "いつでも可能・違約金なし"
    # `note` (「上限に達しても進行中の処理は停止しません。超過料金は発生しません。」) は
    # 削除した。同じ内容は `rollout_note` がカード下に出しており重複していた。
    # `_includes/pricing-cards.html` の `{% if plan.note %}` は汎用の仕組みとして残す。
    cta:
      label: "ダウンロードして申し込む"
      kind: "download"

  - code: enterprise
    name: "Enterprise"
    display: card
    price: 8000
    price_display: "8,000"
    # ⚠️ **表示上の呼称は「アカウント」で統一する** (2026-08-02)。
    #    内部キーは `min_seats` のまま据え置く — Supabase `plan_catalog.min_seats` の
    #    **列名と対応**しており、CI (`scripts/check-plan-catalog.mjs`) が同名で突き合わせる。
    #    キーを変えると突き合わせが壊れる。**変えるのは人が読む文字列だけ。**
    price_unit: "/ アカウント・月"
    # T-298 (2026-09-19): 価格の直下に出す注記。維持管理費用は会社ごとのお見積りなので
    # 金額を書かない (書くと実在しない固定額の広告になる)。描画は
    # `_includes/pricing-cards.html` の `plan.price_note` 分岐 1 箇所だけ。
    # `scripts/check-plan-catalog.mjs` は Supabase の列 (max_contracts / 込み時間 /
    # 月額 / min_seats) しか突き合わせないので、このキーは比較対象外。
    price_note: "+ 維持管理費用 / 月"
    # pooled: アカウント数 × included_hours をチームで共有する
    # T-297 (2026-09-19): 40 → 20 時間。SSOT は `plan_catalog.included_minutes_per_seat` (1200 分)
    included_hours: 20
    included_basis: "pooled"
    min_seats: 3
    # アカウント単価で自己申込を塞いでいるため複数契約の対象外 (枠はアカウント数で増やす)
    max_contracts: 1
    overage_per_hour: null # 従量課金は廃止 (旧 ¥300 / 時間)
    carryover_hours: null
    trial_days: 0
    featured: false
    public: true
    summary: "メーカー・ポストプロダクション向け。最低 3 アカウント（¥24,000〜）。"
    specs:
      - label: "込み時間"
        value: "アカウント数 × 20 時間をプール共有"
      # T-396 (2026-09-21): 暦月合わせ (Stripe の `billing_cycle_anchor` = 次の 1 日 0:00 JST)。
      # 旧「月末締め翌月請求」は実装と食い違っていた (締め日で区切っていない)。
      # 詳しい条件 (初月の起算日・翌月以降の自動更新・請求書払いの期日) は
      # `_includes/docs/07-team.html` の「導入の流れ」が正で、ここはその要約。
      - label: "請求"
        value: "毎月 1 日に当月分を請求（初月は日割り）"
      # T-333 (2026-09-21): カード払いと請求書払いを**対等に並べる**表記へ
      # (T-298 の「請求書払い（クレジットカード即時払い・銀行振込）」は、
      # カードが請求書払いの一種に見えるため)。どちらも見積のあとに送る
      # 支払リンクから選べる — 手順は `_includes/docs/07-team.html` の
      # 「お支払い方法」が正で、ここはその要約。
      - label: "支払方法"
        value: "クレジットカード払い、請求書払い（銀行振込）"
    # T-298 (2026-09-19): Enterprise は**見積ベース**に戻した。申し込みの流れは
    # 導入相談 → 見積書 (T-338: この時点で組織コードも渡る) → dashboard (法人管理) が
    # 発行する支払リンク → ご契約の有効化、であってアプリ内 Checkout ではない。カードの CTA は
    # `/enterprise/inquiry/` への相談リンク 1 本だけにし、T-263 の
    # 「ダウンロードして申し込む」(`kind: download`) と副リンク `secondary_cta` は外した
    # (同じ導線が 2 つ並ぶため)。手順の詳細は `/docs/#team` の「導入の流れ」。
    #
    # ⚠️ **自己申込の可否の真の SSOT は Supabase `plan_catalog.self_serve`** で、
    #    Enterprise は **false のまま**。サイトはその表示側でしかない。self_serve が
    #    false のまま申込ボタンだけを公開すると、押したユーザーが
    #    `seat-based plan requires contact` (400) に当たる = 存在しない導線の広告になる。
    #    自己申込を開くとき (self_serve を true にするとき) の切替順序は
    #    `docs_draft/notes_T-263.md` / `docs_draft/notes_T-298.md` を参照。
    #
    # このカードから相談導線が静かに消えないよう、CI (`.github/workflows/jekyll.yml`)
    # がビルド出力の `href="/enterprise/inquiry/"` と `維持管理費用` を grep で固定している。
    cta:
      label: "導入について相談する"
      # 非 download の CTA は `_includes/pricing-cards.html` が常に `btn-secondary` で
      # 描くため `variant` は持たない (Light / Pro の download CTA だけが使うキー)。
      kind: "link"
      # T-254: 自前の導入相談ページ (Google フォームは廃止)
      href: "/enterprise/inquiry/"
      external: false
