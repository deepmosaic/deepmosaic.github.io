# 料金プランの単一真実源 (TICKET-SITE-03 → TICKET-SITE-20)
#
# ここを唯一の出所にして、料金カード / Free 帯 / ROI 計算機 / JSON-LD の AggregateOffer /
# HERO の無料枠表記 / CTA ブロック の全部から参照する。料金改定が 1 ファイルで済む。
#
# Claude Design の成果物は料金を **料金カードの markup と renderVals() の計算ロジックの
# 2 箇所にハードコード**していた。必ず片方だけ更新されて破綻するので、その構造は移植しない。
#
# ── TICKET-SITE-20: 2 プラン → 3 プラン + Free 帯 ─────────────────────────
#
# ⚠️ **従量課金 (超過課金) は全面廃止した**。Supabase `plan_catalog` の超過単価 /
#    Stripe 価格 ID / メーター名は null 化済みで、Stripe 側の従量 price も archive、
#    メーターも deactivate 済み。**¥800 / ¥500 / ¥300 という単価はもう存在しない**ので、
#    金額を書き戻さないこと (実在しない料金の広告になる)。
#
# ⚠️ アプリ側の課金実装 (front の TICKET-BILL 群) は Phase 0 のみ完了しており、
#    **上限時間はまだ強制されていない**。この事実は `rollout_note` の 1 行で
#    開示する。上限の適用開始後に `rollout_note: ""` とすれば注記だけが消え、
#    他は 1 文字も変えなくてよい。
#
#    枠が足りない場合に同じプランを追加契約できる方式 (本数は各 tier の
#    `max_contracts`) は **2026-08-02 に提供開始**。Worker (deepmosaic-auth0-updater)
#    をデプロイ済みで、Checkout セッションに `adjustable_quantity` が付くため、
#    **出荷済みの v2.1.0 のアプリからでも Stripe の決済画面上で本数を増やせる**。
#    アプリ内の本数セレクタ (PlanSelectDialog) は UX 改善であってゲートではないので、
#    アプリの再出荷を待たずに「できます」と書いてよい。
#
#    「同時起動 1 台」は device_lock で既に強制済みなので注記の対象外。
#
# ⚠️ Free の `included_hours` は **6 のまま**にしている。新デザインの既定値は 3 だが、
#    アプリの `auth/env.rs::FREE_USAGE_LIMIT_SECONDS` は 6h を強制しており、3 と書くと
#    実際の挙動と食い違う。3h 化は front 側の切替と同時に行う。

# 表示通貨と税表記 (全プランで共通)
currency: "JPY"
currency_symbol: "¥"
tax_note: "税別"

# 新料金体系の適用状況。**空文字にすると注記が出ない**。
#
# 2026-08-02 に「準備中です」→ 提供開始の文面へ差し替えた (TICKET-MULTI-CONTRACT)。
# 文面はアプリ `PlanSelectDialog.svelte` の注記と**一字一句同じ**にしてある。
# 片方だけ直すと、アプリとサイトで説明が食い違う。
#
# ⚠️ **この注記がまだ必要な理由は「上限時間」の方**。複数契約は提供開始したが、
#    上限時間そのものはアプリ側でまだ強制されていない。上限の適用を開始したら
#    `rollout_note: ""` にすれば注記だけが消え、他は 1 文字も変えなくてよい。
rollout_note: "上限時間の適用は順次開始します。開始日は事前にお知らせします。超過料金は発生しません ── 枠が足りない場合は同じプランを追加でご契約いただけます（本数の上限はプランごとに異なります）。現在ご利用中のお客様の条件は変わりません。"

# 既存 Pro (無制限) の据え置き。新デザインの注記 (`.dc.html` L691) をそのまま採用する。
# front 側の `from_legacy_plan_name` が全有料文字列を無制限に倒す設計と対応している。
grandfather_note: "既存の Pro（無制限）をご利用中のお客様は、そのまま無制限で継続してご利用いただけます（据え置き）。上限時間の適用は新規のお申し込みのみです。"

# プラン定義。
#
#   display          card = 3 枚並ぶ料金カード / strip = カード下の横帯 (Free)
#   included_basis   cumulative = 累計 (Free) / monthly = 月次 / pooled = シート共有
#   included_hours   included_basis が pooled のときは 1 シートあたりの時間
#   max_contracts    同じプランを重ねて契約できる本数の上限 (1 = 追加契約なし)。
#                    ⚠️ **Supabase `plan_catalog.max_contracts` が真の SSOT。ここは
#                    サイト用の写しで、CI が突き合わせる。** 静的サイトは Supabase を
#                    読めないため写しを置くしかない。乖離したら CI が落ちる
#                    (`scripts/check-plan-catalog.mjs`。込み時間 / 月額 / 最低シート数も
#                    同時に突き合わせる。Supabase に到達できないときは素通しする —
#                    デプロイを外部サービスの可用性に縛らないため)。
#                    front の `src/lib/plan/contract-options.ts` は「コードに数値を
#                    ハードコードしてはならない」と定めており、アプリは catalog から
#                    本数を引く。**サイト内で本数を書いてよいのはここだけ** —
#                    料金カードの「追加契約」行 / FAQ / docs は全てこの値から
#                    Liquid で組み立てる (TICKET-SITE-CONTRACT-SSOT)。
#                    込み時間の合計は `included_hours × max_contracts` で導出できるので
#                    **合計時間はどこにも手書きしない**
#   overage_per_hour 超過 1 時間あたりの単価。**従量課金の廃止により全プラン null**。
#                    ROI 計算機 (src/lib/pricing.js) が参照するのでキーは残す
#   specs            カード内の「ラベル | 値」行。デザインのカード仕様をそのまま持つ。
#                    ⚠️ **「追加契約」行はここに書かない** — `max_contracts` から
#                    `_includes/pricing-cards.html` が組み立てる (本数と合計時間を
#                    静的な文字列で持つと、Supabase の改定で必ず古くなるため)
tiers:
  - code: free
    name: "Free"
    display: strip
    price: 0
    price_display: "0"
    # 累計 (月次リセットではない)。front `auth/env.rs::FREE_USAGE_LIMIT_SECONDS` = 6h と一致
    included_hours: 6
    included_basis: "cumulative"
    max_contracts: 1 # 無料プランは追加契約の対象外
    overage_per_hour: null # 従量課金なし (無料枠を使い切ったら有料プランへ)
    trial_days: 0
    featured: false
    public: true
    summary: "まずは無料で試せます"
    bullets:
      - "累計 6 時間分の動画インポート"
      - "クレジットカードの登録は不要"
      - "無料分の終了後も既存プロジェクトの編集・書き出しは継続できます"
    cta:
      label: "無料でダウンロード"
      kind: "download"

  - code: light
    name: "Light"
    display: card
    price: 2980
    price_display: "2,980"
    price_unit: "/ 月"
    included_hours: 5
    included_basis: "monthly"
    max_contracts: 3
    overage_per_hour: null # 従量課金は廃止 (旧 ¥800 / 時間)
    # 未使用分の翌月繰越の上限 (時間)。**繰越は廃止 (2026-08-02)。全プラン null**。
    # Supabase `plan_catalog.carryover_max_minutes` は sandbox / live とも 0 に更新済み
    # (出荷済みアプリのパース互換のため列自体は残置)。時間を書き戻さないこと
    carryover_hours: null
    trial_days: 0
    featured: false
    public: true
    summary: "同人・個人撮影のクリエイター向け。月 1〜3 本のペースに合わせた枠です。"
    specs:
      - label: "込み時間"
        value: "月 5 時間"
      # 「追加契約」行はここに書かない。`max_contracts` から pricing-cards.html が
      # 込み時間の直後に差し込む (本数・合計時間の手書きを排除するため)。
      - label: "同時起動"
        value: "1 台"
    cta:
      label: "ダウンロードして申し込む"
      kind: "download"
      # Pro (featured) を主ボタンにして視線を集めるため、Light は副ボタン配色にする
      variant: "secondary"

  - code: pro
    name: "Pro"
    display: card
    price: 9800
    price_display: "9,800"
    price_unit: "/ 月"
    included_hours: 40
    included_basis: "monthly"
    max_contracts: 2
    overage_per_hour: null # 従量課金は廃止 (旧 ¥500 / 時間)
    carryover_hours: null
    # 無料トライアルは設けない。クレジットカードを登録しなければ全員が Free プランとして
    # 使えるので、試用期間を別に用意する意味がない (かつ再トライアルの穴も作らない)。
    trial_days: 0
    featured: true
    # カード左上のバッジ (新デザイン準拠)。空なら出さない。
    badge: "最も選ばれています"
    public: true
    # 実効単価 (¥245 / 時間) の表記は削除した。込み時間を「使い切った場合」という
    # 最良ケースの単価で、実際にそこまで使うユーザーは限られるため誤解を招く。
    summary: "フリーランス編集者・専業に近い個人向け。"
    specs:
      - label: "込み時間"
        value: "月 40 時間"
      # 「追加契約」行は `max_contracts` から自動で入る (light の specs のコメントを参照)。
      - label: "同時起動"
        value: "1 台"
      - label: "解約"
        value: "いつでも可能・違約金なし"
    note: "上限に達しても進行中の処理は停止しません。超過料金は発生しません。"
    cta:
      label: "ダウンロードして申し込む"
      kind: "download"

  - code: enterprise
    name: "Enterprise"
    display: card
    price: 8000
    price_display: "8,000"
    price_unit: "/ シート・月"
    # pooled: シート数 × included_hours をチームで共有する
    included_hours: 40
    included_basis: "pooled"
    min_seats: 3
    # シート単価で自己申込を塞いでいるため複数契約の対象外 (枠はシート数で増やす)
    max_contracts: 1
    overage_per_hour: null # 従量課金は廃止 (旧 ¥300 / 時間)
    carryover_hours: null
    trial_days: 0
    featured: false
    public: true
    summary: "メーカー・ポストプロダクション向け。最低 3 シート（¥24,000〜）。"
    specs:
      - label: "込み時間"
        value: "シート数 × 40 時間をプール共有"
      - label: "請求"
        value: "月末締め翌月請求"
      - label: "支払方法"
        value: "請求書払い・銀行振込"
    cta:
      label: "導入について相談する"
      kind: "link"
      href: "https://docs.google.com/forms/d/e/1FAIpQLSedhPxi0r55_iIp8d02qKiFVSG-91P0qib0U6ayKpACw0NLzg/viewform?usp=sf_link"
      external: true
