# 通信内容の開示 + 苦手なケースの開示 (TICKET-SITE-03)
#
# 施策④-2「素材は外に出ないことを *証明する*」と施策④-4「誇大表示を避けつつ信頼を得る」の
# データ。この対比表そのものが説得材料になるので、内容は **実装と厳密に一致させる**。
#
# ⚠️ 変更するときは front の実装を確認すること。ここに書いたものを送っていない /
#    書いていないものを送っていると、それ自体が信頼の毀損になる。

# ── 通信内容の開示 ─────────────────────────────────────────────────────
network:
  sent:
    - item: "ライセンス認証トークン"
    - item: "バージョン確認"
    - item: "初回のAIモデルダウンロード"
    - item: "使用量（動画の秒数）"
    - item: "ファイルのハッシュ値"
      note: "ファイル名は復元できません"
    - item: "エラー情報・処理時間などの動作記録"
      note: "初回に同意をお伺いします"
  not_sent:
    - item: "映像・音声"
    - item: "フレーム画像・サムネイル"
    - item: "検出結果の座標"
    - item: "ファイル名"
      note: "ハッシュ値のみを送信します"
    - item: "プロジェクト情報・作品タイトル"

# オフライン検証手順。**ユーザー自身が確かめられる主張は最強の信頼担保**なので、
# 手順まで書く (施策④-2)。
offline_steps:
  - "初回セットアップを完了させる（AIモデルのダウンロードにのみ通信が必要です）"
  - "LANケーブルを抜く、または Wi-Fi をオフにする"
  - "動画の読み込み・検出・編集・書き出しを実行する"

# ── 検出精度が落ちやすいケース (施策④-4) ───────────────────────────────
# 「審査に必ず通ります」「検出漏れゼロ」は書かない。弱点を先に言うベンダーは信用される。
weaknesses:
  - case: "極端な逆光・低照度"
    effect: "精度が低下します"
  - case: "激しいブレ・高速なカメラワーク"
    effect: "精度が低下します"
  - case: "部分的な遮蔽（手・衣服・小道具）"
    effect: "検出が途切れることがあります"
  - case: "特殊なアングル・学習データに乏しい構図"
    effect: "精度が低下します"
  - case: "アニメーション・3DCG作品"
    effect: "実写より精度が下がります"

# あえて明記するもの。隠すと不信を招くが、明記すると誠実さの証明になる。
responsibility: "最終的な確認と表現に関する責任は制作者に帰属します。本ソフトウェアは確認作業の効率化を目的としたものであり、審査通過を保証するものではありません。"

# 検出率の実測値は未公開。伏字 (「○時間・○シーン」) は出さず、
# 「まだ測っていない」という事実だけを誠実に書く。
accuracy_note: "検出率の実測値は、計測条件（テストデータの時間数・シーン数）とあわせて公開します。数値が確定するまでは、断定的な精度表記を行いません。"
