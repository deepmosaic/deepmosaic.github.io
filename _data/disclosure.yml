# 通信内容の開示と苦手なケースの開示のデータ。内容はアプリの実装と一致させる。

# ── 通信内容の開示 ─────────────────────────────────────────────────────
network:
  sent:
    - item: "ライセンス認証トークン"
    - item: "バージョン確認"
    - item: "初回のAIモデルダウンロード"
    - item: "使用量（動画の秒数）"
    - item: "ファイルのハッシュ値"
      note: "ファイル名は復元できません"
    # 無料枠の管理 (端末上限 2 時間) のため。元の値は送らない (privacy.html 10 項)。
    - item: "端末識別子（ハッシュ化した値）"
      note: "無料枠の管理のため。識別子からは端末や個人を特定できません（サインイン済みのときはアカウントと結び付けます）"
    # 無料期間 (初めて起動した日から 7 日) の管理のため (privacy.html 10 項)。
    - item: "無料枠の利用開始日時"
      note: "無料期間（初めて起動した日からの日数）の管理のため。端末ごと・アカウントごとに記録します"
    # 画面の移動と全操作を固定の名前で記録する (privacy.html 12・13 項)。行の数・順・note の有無は英中の写しと揃える。
    - item: "画面の移動・操作・エラー・処理時間などの動作記録"
      note: "固定の名前で記録し、入力した文字・ファイル名・パスは含みません。使用許諾契約書・利用規約への同意時にご案内します"
  not_sent:
    - item: "映像・音声"
    - item: "フレーム画像・サムネイル"
    - item: "検出結果の座標"
    - item: "ファイル名"
      note: "ハッシュ値のみを送信します"
    - item: "プロジェクト情報・作品タイトル"

# オフラインでの確かめ方の手順。
offline_steps:
  - "初回セットアップを完了させる（AIモデルのダウンロードにのみ通信が必要です）"
  - "LANケーブルを抜く、または Wi-Fi をオフにする"
  - "動画の読み込み・検出・編集・書き出しを実行する"

# ── 検出精度が落ちやすいケース ───────────────────────────────
# 「審査に必ず通ります」「検出漏れゼロ」は書かない。
# kv-table.html の期待形 (key / val) に揃えている。
weaknesses:
  - key: "極端な逆光・低照度"
    val: "精度が低下します"
  - key: "激しいブレ・高速なカメラワーク"
    val: "精度が低下します"
  - key: "部分的な遮蔽（手・衣服・小道具）"
    val: "検出が途切れることがあります"
  - key: "特殊なアングル・学習データに乏しい構図"
    val: "精度が低下します"
  - key: "アニメーション・3DCG作品"
    val: "実写より精度が下がります"

# あえて明記するもの。隠すと不信を招くが、明記すると誠実さの証明になる。
responsibility: "最終的な確認と表現に関する責任は制作者に帰属します。本ソフトウェアは確認作業の効率化を目的としたものであり、審査通過を保証するものではありません。"

# 検出率の実測値は書かない。伏字 (「○時間・○シーン」) は出さず、
# 「まだ測っていない」という事実だけを誠実に書く。
accuracy_note: "検出率の実測値は、計測条件（テストデータの時間数・シーン数）とあわせて公開します。数値が確定するまでは、断定的な精度表記を行いません。"
