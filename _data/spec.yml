# ── GPU と処理速度の目安 (実測 + 推定、T-1887 で 2026-10 以降の値に差し替え) ─────────────
# 値は「動画長の何倍の時間がかかるか」(検出の開始から完了まで = 準備 → 前処理 → 検出 → 解析 → モザイクの精緻化。書き出しは含まない)。
# 実測 = 本番の検出記録 (管理 API /admin/detection-runs、2026-10-01〜11-08、desktop・完了・幅 1080〜1920px・30 秒以上) の中央値。
#   RTX 3070 Ti 2.12 (7 件 / 2 人) / 4070 Ti 1.26 (4 / 2) / 5070 Ti 1.08 (8 / 3) / 3060 2.75 (6 / 3) / GTX 10・16 は p25 9.1〜p75 24.6 (32 / 5) /
#   GPU なし 2.89 (35 / 15、軽量モデル・精緻化なし)。範囲指定の実行を除けていない (API に列が無い)。
# 推定 = 0.24 + 1.53 ÷ 性能指数 (性能指数 = FP32 TFLOPS 比とメモリ帯域比の幾何平均、RTX 3070 Ti = 1。係数は上の実測 4 機種
#   (3060 / 3070 Ti / 4070 Ti / 5070 Ti) への最小二乗)。公称値は NVIDIA の製品ページ / TechPowerUp。0.1 倍に丸め、分は丸めた倍率 × 10。
#   計算と取得のスクリプトは親リポ CHANGELOG の T-1887。実測が増えたら係数を取り直す (site-copy-t1887.test.js が実測の値を固定)。
performance_note: "下記は、1080p・30fps の動画を検出するのに「動画の長さの何倍の時間がかかるか」の目安です（検出の開始から完了まで。形に沿ったモザイクの精緻化を含み、書き出しは含みません）。「実測」は本番環境の 2026-10〜11 の中央値、「推定」は実測に合わせた計算式と各 GPU の公称性能から求めた値で、±30% 程度の幅があります。60fps の動画は最大で約 2 倍かかり、顔の数など素材の内容によっても変わります。また、GPU を使う場合も動画の読み込み・前処理・解析は CPU で行うため、処理時間は CPU の性能にも依存します（特に上位の GPU ほど CPU の影響が大きくなります）。"
