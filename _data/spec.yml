# 動作環境 (/spec/) のデータ。GPU と処理速度の表は実測と推定の値で、過大な数値は出さない。

windows:
  - key: "OS"
    val: "Microsoft Windows 10 / 11（64 ビット）"
  - key: "メモリ"
    val: "8GB 以上（16GB 推奨）"
  - key: "GPU"
    val: "NVIDIA GeForce RTX 3000 シリーズ以上 (CUDA 対応) + 最新ドライバ<br>RTX 3000 シリーズ未満の GPU は動作未確認です。GPU が無い場合も CPU モードで動作しますが、処理速度は大幅に低下します"
  - key: "ドライバ"
    val: "NVENC ハードウェアエンコードを使う場合は 570 以上"
  # WebView2 のランタイムはインストーラが自動で入れるので、この表には並べない (src/lib/spec-requirements.test.js)。
  - key: "ストレージ"
    val: "初回セットアップで AI モデル等に 10GB程度"
  # アプリの表示言語。切り替えの場所 (どのボタンか) は書かない (版で変わるため。説明は docs 第 1 章)。
  - key: "表示言語"
    val: "日本語 / English / 繁體中文（初めて起動したときは Windows の表示言語に合わせて選ばれ、日本語・英語・中国語以外は英語になります。アプリ内でいつでも切り替えられます）"
  # Store 版の行は `_data/site.yml` の distribution.store_enabled が true のときだけ出す (store_only。ページと llms-full.txt が除く)。
  #    最小の OS は Store 版のパッケージが求める版 (10.0.19041.0 = Windows 10 バージョン 2004)。
  - key: "Microsoft Store 版"
    val: "Windows 10 バージョン 2004 以降。Microsoft Store から入手し、更新も Microsoft Store が配信します"
    store_only: true

# ── GPU と処理速度の目安 ─────────────
# 値は「動画長の何倍の時間がかかるか」(検出の開始から完了まで。書き出しは含まない)。
# 実測 = 実測値。
# 推定 = 0.24 + 1.53 ÷ 性能指数 (性能指数 = FP32 TFLOPS 比とメモリ帯域比の幾何平均、RTX 3070 Ti = 1。係数は実測 4 機種への最小二乗)。
#   公称値は NVIDIA の製品ページ / TechPowerUp。0.1 倍に丸め、分は丸めた倍率 × 10 (site-copy-spec-gpu-speed.test.js が実測の値を固定)。
performance_note: "下記は、1080p・30fps の動画を検出するのに「動画の長さの何倍の時間がかかるか」の目安です（検出の開始から完了まで。形に沿ったモザイクの精緻化を含み、書き出しは含みません）。「実測」は本番環境の 2026-10〜11 の中央値、「推定」は実測に合わせた計算式と各 GPU の公称性能から求めた値で、±30% 程度の幅があります。60fps の動画は最大で約 2 倍かかり、顔の数など素材の内容によっても変わります。また、GPU を使う場合も動画の読み込み・前処理・解析は CPU で行うため、処理時間は CPU の性能にも依存します（特に上位の GPU ほど CPU の影響が大きくなります）。"
