items:
  - q: "What kind of software is Deepmosaic?"
    a: "It is a Windows desktop app that uses AI to automatically detect and track targets in a video and apply mosaic to those areas. You can review and correct the detection results in the editing screen, and it supports exporting videos with the mosaic burned in and importing the mosaic information into Adobe Premiere Pro. It is intended to streamline pre-submission work in video production where mosaic must be applied."
  - q: "Can Deepmosaic take existing mosaic off a video?"
    a: "No. Deepmosaic is software for applying (adding) mosaic to videos. It has no feature to restore footage that already has mosaic or other edits to its original state, and there are no plans to add one. The AI only detects the positions of targets, and the app then overlays mosaic on those areas and outputs the result."
  - q: "What happens to videos that already have mosaic?"
    a: "If you turn on the \"Mosaic\" detection target, the app finds the position and extent of existing mosaic and lets you apply new mosaic over it. It cannot take mosaic off or restore the original footage."
  - q: "Is my footage really never sent outside?"
    a: "Yes. AI detection, editing, and export all happen entirely on your PC. Video, audio, frame images, the coordinates of detection results, and file names are never sent. After the initial setup, the app works even with the network disconnected, so you can check this yourself. A list of the data that is sent is published in \"Data transmission disclosure\"."
  - q: "Do you guarantee that my video will pass review?"
    a: "No, we cannot guarantee it. Review is at the discretion of each organization, and it is not something we can be involved in. The software provides the mosaic block size and coverage as settings and streamlines the work of checking for missed detections. Final checks and responsibility for the content rest with the creator."
  - q: "What happens if there are missed detections?"
    a: "You can review and correct all detection results in the editing screen. You can add, delete, and move detection boxes, change the mosaic block size, and jump to frames where detection drops out (the [ and ] keys). Cases the AI struggles with (extreme backlighting, heavy motion blur, partial occlusion, and so on) are published in \"Known weaknesses and limitations\"."
  - q: "Can I take mosaic off later after applying it?"
    a: "Within a project in the app, you can change the mosaic range, block size, and type at any time and export again. You can redo it as many times as you like with the same media. Exports are saved as new files, and you choose the destination each time you export, so the original video is never overwritten automatically. However, mosaic cannot be taken off an exported video that already has the mosaic burned in."
  - q: "How long does processing take?"
    a: "It depends heavily on GPU performance and the resolution of the media, and also on CPU performance (even when the GPU is used, video loading, preprocessing, and analysis run on the CPU). In production measurements, the median for 1080p media is about 1–3 times the video length (about 1.1× on an RTX 5070 Ti, about 1.3× on an RTX 4070 Ti, about 2.1× on an RTX 3070 Ti, and about 2.8× on an RTX 3060). The GTX 10 / 16 series takes about 10–25 times the video length, so it is not suitable for long videos. Without a GPU, detection uses the lightweight model and the \"Refine mosaic\" stage is skipped, so the median is about 3 times the video length, though it varies greatly with CPU performance. You don't need to operate the app during processing, and you can resume from the review step once it finishes. Estimates for each GPU are listed on the system requirements page."
  - q: "Can I use it for free?"
    a: "Yes. For 7 days from the day you first launch the app, you can import up to 2 hours of video in total for free. Right after downloading, you can use up to 30 minutes in total, and creating a free account raises that to 2 hours. The free period ends after 7 days or when you reach the total limit, whichever comes first. Even if you sign up again with a different account, the same PC is limited to 2 hours in total. No credit card is required. After the free period ends, you can keep editing and exporting existing projects."
  - q: "Will processing stop if I go over the hour limit?"
    a: "Processing in progress does not stop, and there are no overage charges. If your allowance is not enough, you can add more subscriptions to the same plan (Light: up to %%LIGHT_MAX%% subscriptions for %%LIGHT_TOTAL%% hours a month; Pro: up to %%PRO_MAX%% subscriptions for %%PRO_TOTAL%% hours a month). The included hours for each plan are listed on the pricing page."
  - q: "Is a GPU required? Do you support Mac?"
    a: "AI detection also works with a CPU alone, but processing becomes much slower (about 2 fps in our measurements). For comfortable use, we recommend an NVIDIA GeForce RTX 3000 series GPU or higher. GPUs below that level have not been tested. A macOS version is in development, and its release date has not been decided. At this time, only Windows 10 / 11 (64-bit) is supported."
  - q: "Which Adobe products does it work with?"
    a: "It supports Adobe Premiere Pro. You can import AI-detected mosaic information into a Premiere Pro project with one click. The app also guides you through setting up the plug-in automatically. Exporting videos with the mosaic burned in can also be done entirely within the app."
  - q: "How do I update the app?"
    a: "The app automatically checks for a new version at launch and shows a dialog if an update is available. You can update with one click."
  - q: "Can I cancel anytime?"
    a: "Yes. You can cancel a paid plan at any time. There are no cancellation fees of any kind. You can cancel from the payment portal."
  - q: "Is it the same as the open-source DeepMosaics?"
    a: "No, it is a different product. \"DeepMosaics\", which is published as open source, is a tool known for uses such as taking mosaic off. Although the names are similar, it has nothing to do with Deepmosaic in either developer or features. Deepmosaic is software for applying (adding) mosaic to videos and has no feature to take off mosaic that is already there."
