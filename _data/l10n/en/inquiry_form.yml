# T-2206 (i18n1112 I18N-708): 問い合わせフォームの JS が無いときの代わり (`_includes/inquiry-form.html` の noscript) の英語。
# このファイルの持ち主は I18N-708 だけ。
#   - include が `site.data.l10n[page.lang].inquiry_form` で引く。ja の文と mailto の件名は include に直書きのまま。
#   - 形は平らな `key: "value"` と、`key:` + `  - "value"` の配列だけ (src/lib/i18n-site-inquiry.test.js が読む)。
#   - 件名 (*_subject) は英語 (受け手は日本の担当者、W7-site.md・spec I18N-708)。include が uri_escape する。
#   - 項目の一覧 (*_items) は ja の noscript と同じ数・同じ順。
js_required_before: "This form requires JavaScript. If you can't turn on JavaScript, email the following items to "
js_required_after: "."
general_subject: "Inquiry"
enterprise_subject: "Enterprise inquiry"
general_items:
  - "Email address"
  - "Message"
enterprise_items:
  - "Company name"
  - "Company website (optional)"
  - "Name"
  - "Email address"
  - "Phone number"
  - "Planned number of accounts (1 or more)"
  - "Details of your inquiry"
