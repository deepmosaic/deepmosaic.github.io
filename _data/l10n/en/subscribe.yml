store_note: "In the Microsoft Store version of the app, you can also subscribe from the profile menu at the top right of the screen (the payment screen opens in your browser). You can also subscribe on this page with your Web app account."
faq:
  - q: "Can I subscribe in the app?"
    a: "Yes. In the Windows app, you can subscribe from the profile menu at the top right of the screen (the payment screen opens in your browser). You can also use the buttons on this page and sign in to your account in the Web app (in your browser). Either way, you can use your paid plan with the same account in both the Desktop app and the Web app."
  - q: "Can I subscribe in the Microsoft Store version of the app?"
    store_only: true
    a: "Yes. In the Microsoft Store version of the app, you can also subscribe from the profile menu at the top right of the screen. The payment screen opens in your browser, and your plan is reflected in the app once you have finished. You can also change or cancel your plan and change your payment method in the app."
  - q: "Do I need to subscribe with the same account as the app?"
    a: "Yes. Plans are tied to an account (email address). Sign in with the account you use in the app and subscribe. If you don't have an account yet, you can create one from \"Sign in\" on the sign-in screen (your account is created automatically when you sign in with a confirmation code sent to your email)."
  - q: "Where do I change or cancel my plan?"
    a: "Sign in to the Web app and open \"Plan subscription and management\" from the profile menu at the top right of the screen. You can also change your payment method there. You can also use \"Plan subscription and management\" in the profile menu in the Windows app. After you cancel, you can keep using your paid plan until the end of the period you have already paid for."
