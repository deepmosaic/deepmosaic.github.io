# T-2201 (i18n1112 I18N-703): `_data/subscribe.yml` の英語の訳 (store_note と faq)。faq は ja と同じ順・同じ件数 (4)・同じ位置に store_only (T-2306)。
# checkout_query などの設定値は持たない (正は ja のデータ)。
_source: "_data/subscribe.yml"
