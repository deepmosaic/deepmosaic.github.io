      val: "In the first release, this is expected to be a Windows-only feature."
performance_note: "The figures below are a guide to how many times the video length it takes to detect a 1080p, 30 fps video (from the start to the end of detection, including mosaic refinement that follows the shape of objects, excluding export). \"Measured\" values are medians from the production environment for 2026-10 to 2026-11, and \"estimated\" values are calculated from a formula fitted to the measured values and the rated performance of each GPU, with a margin of about ±30%. A 60 fps video can take up to about 2 times as long, and the time also varies with the content of the media, such as the number of faces. Even when a GPU is used, video loading, preprocessing, and analysis run on the CPU, so processing time also depends on CPU performance (the higher-end the GPU, the greater the effect of the CPU)."
