spec: "Requirements"                           # 動作環境 (ナビ)
spec_full: "System requirements"               # 動作環境 (フッター)
store_cta: "Microsoft Store"                   # Microsoft Store で入手
store_cta_lead: ""
store_cta_lg: "Microsoft "
store_cta_tail: "Store"                        # Store で入手 (md の短い形)
enterprise: "Business inquiries"               # 法人様はこちら
enterprise_short: "Business"                   # 法人様 (md の短い形)
enterprise_lg: " inquiries"
download: "Download"                           # ダウンロード (ドロワー)
contact: "Contact us"                          # 問い合わせ (ドロワー)
footer_product: "Product"                      # 製品
footer_company: "Company"                      # 会社情報
subscribe: "Subscribe to a paid plan"          # 有料プランのお申し込み
mosaic_removal: "About existing mosaic"         # モザイク除去について (除去の語は使わない = W7-site.md §2)
