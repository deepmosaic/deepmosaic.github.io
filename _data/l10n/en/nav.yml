# T-2204 (i18n1112 I18N-706): 英中のヘッダー・フッター・モバイルのドロワーの文 (en)。このファイルの持ち主は I18N-706 だけ。
#   - 部品 (header-intl.html・footer-intl.html) が `site.data.l10n[page.lang].nav` で引く。ja の文は部品 (header.html・footer.html) に直書きのまま。
#   - 平らな `key: "value"` だけ (src/lib/i18n-site-nav.test.js が読む)。値に " ' < > \ を書かない (属性と data-links の JSON を壊す)。
#   - 長い形と短い形: store_cta = store_cta_lead + store_cta_lg + store_cta_tail、enterprise = enterprise_short + enterprise_lg
#     (lg 未満では *_lg を隠す。textContent は全幅で長い形のまま = GA4 の link_text)。
#   - 料金・会社について・利用規約などのフッターのラベルは `_data/lang/en.json` の既存のキー (price・company・terms …) を使う。
home: "Home"                                   # ホーム
