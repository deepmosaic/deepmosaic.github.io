# T-2202 (i18n1112 I18N-704): `_data/spec.yml` (動作環境) の繁体字中国語 (台湾) の文だけ。ja と同じ入れ子・同じ件数・同じ順。
# 数値・機種名・形式の一覧の正は ja のデータ。performance の key の機種名は訳さずにそのまま写す (kv-table.html が key / val の組を回すため)。
# 日本語を含む key (GTX 10 / 16 シリーズ・GPU なし) だけを訳す。val の中の <br> はそのまま残す。
# 「・推定」「・実測」の中黒 (U+30FB) は仮名の範囲で lang-text に当たるので「，」で区切る。
# ja を直したら訳も直し、accept-site.mjs で hash を書き直す。
