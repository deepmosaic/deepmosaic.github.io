performance_note: "以下為偵測 1080p、30 fps 的影片時，「所需時間約為影片長度幾倍」的參考值（從偵測開始到完成，包含沿著物體形狀的馬賽克精細化，不含匯出）。「實測」為正式環境 2026 年 10～11 月的中位數，「推估」為依據配合實測值所訂的計算公式與各 GPU 的標稱效能求得的值，約有 ±30% 的誤差。60 fps 的影片最多約需 2 倍的時間，也會因臉部數量等素材內容而不同。此外，即使使用 GPU，影片的載入、前處理與分析仍由 CPU 進行，因此處理時間也取決於 CPU 的效能（GPU 等級越高，CPU 的影響越大）。"
