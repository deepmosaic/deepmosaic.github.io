# T-2204 (i18n1112 I18N-706): 英中のヘッダー・フッター・モバイルのドロワーの文 (zh-tw)。このファイルの持ち主は I18N-706 だけ。
#   - 部品 (header-intl.html・footer-intl.html) が `site.data.l10n[page.lang].nav` で引く。ja の文は部品 (header.html・footer.html) に直書きのまま。
#   - 平らな `key: "value"` だけ (src/lib/i18n-site-nav.test.js が読む)。値に " ' < > \ を書かない (属性と data-links の JSON を壊す)。
#   - 長い形と短い形: store_cta = store_cta_lead + store_cta_lg + store_cta_tail、enterprise = enterprise_short + enterprise_lg
#     (lg 未満では *_lg を隠す。textContent は全幅で長い形のまま = GA4 の link_text)。
#   - 料金・会社について・利用規約などのフッターのラベルは `_data/lang/zh-tw.json` の既存のキー (price・company・terms …) を使う。
home: "首頁"                                   # ホーム
pricing: "價格"                                # 料金
docs: "說明文件"                               # ドキュメント
spec: "系統需求"                               # 動作環境 (ナビ)
spec_full: "系統需求"                          # 動作環境 (フッター)
store_cta: "在 Microsoft Store 取得"           # Microsoft Store で入手
store_cta_lead: "在 "
store_cta_lg: "Microsoft "
store_cta_tail: "Store 取得"                   # Store で入手 (md の短い形 = 在 Store 取得)
enterprise: "企業方案"                         # 法人様はこちら
enterprise_short: "企業"                       # 法人様 (md の短い形)
enterprise_lg: "方案"
download: "下載"                               # ダウンロード (ドロワー)
contact: "聯絡我們"                            # 問い合わせ (ドロワー)
footer_product: "產品"                         # 製品
footer_company: "公司資訊"                     # 会社情報
subscribe: "申請付費方案"                      # 有料プランのお申し込み
mosaic_removal: "Deepmosaic 只會加上馬賽克"      # モザイク除去について (除去の語は使わない = W7-site.md §2。リンク先の h1 と同じ向き、既有馬賽克は機能名なので使わない)
download_store: "下載（Microsoft Store）"      # ダウンロード（Microsoft Store）
