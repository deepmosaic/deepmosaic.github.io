_source: "_data/disclosure.yml"
_source_hash: "6e281dd354f8c8465a3f92c7d667b76744bcfa18cb07f3689371dc1e715c47a1"
network:
  sent:
    - item: "授權驗證權杖"
    - item: "版本確認"
    - item: "首次下載 AI 模型"
    - item: "使用量（影片的秒數）"
    - item: "檔案的雜湊值"
      note: "無法從中還原檔案名稱。"
    - item: "裝置識別碼（經雜湊處理的值）"
      note: "用於管理免費額度。無法從識別碼辨識出裝置或個人（登入期間會與帳號連結）。"
    - item: "開始使用免費額度的日期與時間"
      note: "用於管理免費期間（從首次啟動那天起算的天數）。依裝置及帳號分別記錄。"
    - item: "錯誤資訊、處理時間等運作記錄"
      note: "會在您同意使用者授權合約與服務條款時說明。"
  not_sent:
    - item: "影像與音訊"
    - item: "影格圖片與縮圖"
    - item: "偵測結果的座標"
    - item: "檔案名稱"
      note: "僅傳送雜湊值。"
    - item: "專案資訊與作品標題"
offline_steps:
  - "完成初始設定（僅下載 AI 模型時需要網路連線）"
  - "拔除網路線，或關閉 Wi-Fi"
  - "執行影片的載入、偵測、編輯與匯出"
weaknesses:
  - key: "極端逆光、低照度"
    val: "精確度會下降"
  - key: "劇烈晃動、快速的運鏡"
    val: "精確度會下降"
  - key: "部分遮蔽（手、衣物、道具）"
    val: "偵測可能會中斷"
  - key: "特殊角度、訓練資料較少的構圖"
    val: "精確度會下降"
  - key: "動畫、3DCG 作品"
    val: "精確度會低於真人實拍"
responsibility: "最終確認與表現內容的責任歸屬於製作者。本軟體的目的在於提升確認作業的效率，並不保證能通過審查。"
accuracy_note: "偵測率的實測值將連同測量條件（測試資料的時數與場景數）一併公開。在數值確定之前，不會做出斷定性的精確度標示。"
