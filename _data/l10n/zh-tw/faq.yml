items:
  - q: "Deepmosaic 是什麼樣的軟體？"
    a: "這是一款適用於 Windows 的桌面應用程式，由 AI 自動偵測並追蹤影片中的對象，再對該範圍套用馬賽克。偵測結果可在編輯畫面中確認與修正，並支援匯出已燒錄馬賽克的影片，以及將馬賽克資訊匯入 Adobe Premiere Pro。適合用於需要馬賽克處理的影像製作現場，提升送審前作業的效率。"
  - q: "可以消除影片中既有的馬賽克嗎？"
    a: "無法。Deepmosaic 是為影像套用（加上）馬賽克的軟體，不具備將已有馬賽克或其他遮蔽處理的影像還原為原始狀態的功能，今後也沒有加入此功能的計畫。AI 只負責偵測對象的位置，再於該範圍疊加馬賽克後輸出。"
  - q: "已經有馬賽克的影片會怎麼樣？"
    a: "開啟偵測對象中的「馬賽克」後，即可找出既有馬賽克的位置與範圍，並在其上重新套用新的馬賽克。無法將馬賽克拿掉，也無法還原為原始影像。"
  - q: "影像真的不會傳送到外部嗎？"
    a: "是的。AI 偵測、編輯與匯出全部在您的 PC 上完成。影像、音訊、影格圖片、偵測結果的座標與檔案名稱一律不會傳送。完成初始設定後，即使中斷網路連線也能運作，您可以親自確認。傳送資料的清單刊載於「通訊內容揭露」。"
  - q: "能保證通過審查嗎？"
    a: "無法保證。審查由各團體自行判斷，並非本公司所能介入。本軟體以設定的形式提供馬賽克格大小與遮蔽率，用於提升確認漏偵測的作業效率。最終確認與表現內容的責任歸屬於製作者。"
  - q: "如果有漏偵測會怎麼樣？"
    a: "所有偵測結果都可在編輯畫面中確認與修正。支援新增、刪除與移動偵測框、變更馬賽克格大小，以及跳至偵測中斷的影格（鍵盤的 [ 與 ]）。AI 不擅長的情況（極端逆光、劇烈晃動、部分遮蔽等）已公開於「不擅長的情況與限制事項」。"
  - q: "套用後的馬賽克之後還能拿掉嗎？"
    a: "只要是在應用程式內的專案，隨時都能變更馬賽克的範圍、馬賽克格大小與種類並重新匯出。同一份素材可以重做任意次數。匯出的內容會儲存為新的檔案，且每次匯出時都會指定儲存位置，因此不會自動覆寫原始影片。但已燒錄馬賽克並匯出的影片本身，無法將馬賽克拿掉。"
  - q: "處理需要多少時間？"
    a: "很大程度取決於 GPU 的效能與素材的解析度，也與 CPU 的效能有關（即使使用 GPU，影片的載入、前置處理與分析也由 CPU 進行）。根據正式環境的實測，1080p 素材的中位數約為影片長度的 1 至 3 倍（RTX 5070 Ti 約 1.1 倍、RTX 4070 Ti 約 1.3 倍、RTX 3070 Ti 約 2.1 倍、RTX 3060 約 2.8 倍）。GTX 10 / 16 系列約需影片長度的 10 至 25 倍，不適合處理較長的影片。沒有 GPU 時會以輕量模型偵測，且不進行「精修馬賽克」，中位數約為影片長度的 3 倍，但會因 CPU 效能而有很大差異。處理期間不需要操作應用程式，完成後即可從確認作業繼續。各 GPU 的參考值刊載於系統需求頁面。"
  - q: "可以免費使用嗎？"
    a: "可以。自首次啟動當日起 7 天內，可免費匯入累計最多 2 小時的影片。下載後即可直接使用的額度為累計 30 分鐘，免費註冊帳號後可增加到 2 小時。免費期間於 7 天或達到累計上限兩者中較早到達時結束。即使以其他帳號重新註冊，同一台 PC 合計仍以 2 小時為上限。不需要登記信用卡。免費期間結束後，仍可繼續編輯與匯出既有專案。"
  - q: "超過時數上限後處理會停止嗎？"
    a: "進行中的處理不會停止，也不會產生超額費用。額度不足時，可追加訂閱同一方案（Light 最多 %%LIGHT_MAX%% 份訂閱，每月 %%LIGHT_TOTAL%% 小時；Pro 最多 %%PRO_MAX%% 份訂閱，每月 %%PRO_TOTAL%% 小時）。各方案的內含時數刊載於價格頁面。"
  - q: "必須要有 GPU 嗎？支援 Mac 嗎？"
    a: "AI 偵測僅用 CPU 也能運作，但處理速度會大幅下降（實測約 2 fps）。為了順暢使用，建議使用 NVIDIA GeForce RTX 3000 系列以上的 GPU。低於此等級的 GPU 尚未確認能否運作。macOS 版正在開發中，推出時間未定。目前僅支援 Windows 10 / 11（64 位元）。"
  - q: "可以與哪些 Adobe 產品搭配使用？"
    a: "支援 Adobe Premiere Pro。只要按一下，即可將 AI 偵測到的馬賽克資訊匯入 Premiere Pro 的專案。應用程式也會自動引導您完成增效模組的設定。燒錄馬賽克的影片也能直接在應用程式內匯出。"
  - q: "如何更新應用程式？"
    a: "應用程式啟動時會自動檢查新版本，若有更新會以對話方塊通知您。按一下即可更新。"
  - q: "可以隨時取消訂閱嗎？"
    a: "可以。付費方案可隨時取消訂閱，不收取任何違約金。取消訂閱可在付款入口網站進行。"
  - q: "與開源的 DeepMosaics 是相同的東西嗎？"
    a: "不是，兩者是不同的產品。以開放原始碼公開的「DeepMosaics」是一款以拿掉馬賽克等用途而為人所知的工具，名稱雖然相似，但與 Deepmosaic 在開發者與功能上都沒有任何關係。Deepmosaic 是為影片套用（加上）馬賽克的軟體，不具備拿掉既有馬賽克的功能。"
