faq:
  - q: "可以在 Microsoft Store 版的應用程式中訂閱嗎？"
    a: "Microsoft Store 版的應用程式沒有購買畫面。若要訂閱付費方案，請使用本頁面的按鈕，在網頁版（瀏覽器）中登入帳號後進行。完成手續後，在應用程式中以同一個帳號登入，即可直接使用付費方案。"
  - q: "需要使用與應用程式相同的帳號訂閱嗎？"
    a: "是的。方案與帳號（電子郵件地址）綁定。請以您在應用程式中使用的帳號登入並訂閱。若您還沒有帳號，也可以從登入畫面的「登入」建立（以寄到電子郵件的驗證碼登入時，會自動建立帳號）。"
  - q: "要在哪裡變更方案或取消訂閱？"
    a: "請登入網頁版，從畫面右上角個人資料選單中的「方案管理」進行（付款方式也在同一個畫面變更）。取消訂閱後，仍可使用付費方案至已付款訂閱期間的最後一天。"
