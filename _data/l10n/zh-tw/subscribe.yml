# T-2201 (i18n1112 I18N-703): `_data/subscribe.yml` の繁体字中国語 (台湾) の訳 (store_note と faq)。faq は ja と同じ順・同じ件数 (4)・同じ位置に store_only (T-2306)。
# checkout_query などの設定値は持たない (正は ja のデータ)。
_source: "_data/subscribe.yml"
_source_hash: "a2fd12afc801f17d4ded6283b220a11538a931dc942d8cfe82ef8b9dd4b51fa4"
store_note: "Microsoft Store 版的應用程式沒有購買畫面。使用 Microsoft Store 版的使用者，請從本頁面申請（以與應用程式相同的帳號登入，即可直接在應用程式中使用）。"
faq:
  - q: "可以在應用程式中訂閱嗎？"
    a: "可以。下載使用 Windows 版的使用者，可從應用程式畫面右上角的個人資料選單訂閱。也可以使用本頁面的按鈕，在網頁版（瀏覽器）中登入帳號後訂閱。無論從哪裡訂閱，同一個帳號在桌面版與網頁版都能使用付費方案。"
  - q: "可以在 Microsoft Store 版的應用程式中訂閱嗎？"
    store_only: true
    a: "Microsoft Store 版的應用程式沒有購買畫面。若要訂閱付費方案，請使用本頁面的按鈕，在網頁版（瀏覽器）中登入帳號後進行。完成手續後，在應用程式中以同一個帳號登入，即可直接使用付費方案。"
  - q: "需要使用與應用程式相同的帳號訂閱嗎？"
    a: "是的。方案與帳號（電子郵件地址）綁定。請以您在應用程式中使用的帳號登入並訂閱。若您還沒有帳號，也可以從登入畫面的「登入」建立（以寄到電子郵件的驗證碼登入時，會自動建立帳號）。"
  - q: "要在哪裡變更方案或取消訂閱？"
    a: "請登入網頁版，從畫面右上角個人資料選單中的「方案管理」進行。付款方式也在同一個畫面變更。下載使用 Windows 版的使用者，也可從應用程式個人資料選單中的「方案管理」進行。取消訂閱後，仍可使用付費方案至已付款訂閱期間的最後一天。"
