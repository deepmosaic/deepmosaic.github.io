# T-2202 (i18n1112 I18N-704): `_data/entity.yml` (製品の説明と誤認の訂正) の繁体字中国語 (台湾) の文だけ。原文は各欄の ja (素の文字列はその値)。
# name・product_name・alternate_names・os・category・subcategory・screenshot は訳さない値なので持たない (ja のデータを使う)。
# 除去の語 (去除・移除など) を使うのは cannot・disambiguation・oss_distinction・confusion_reasons だけ (/mosaic-removal/ と can-cannot.html で出る)。
# one_liner・not_removal_note・definition・can・name_origin はトップ・料金・動作環境にも出るので除去の語を使わない (ja の「取り除く」は「去掉」)。
# ja を直したら訳も直し、accept-site.mjs で hash を書き直す。
_source: "_data/entity.yml"
_source_hash: "342880aa4a1d8693bfebdff540a2c735f3265e479fd6e4aff6055435fac6807d"
definition: "Deepmosaic 是一款由 AI 自動偵測影片中的對象（身體部位、臉部），並對該範圍套用馬賽克的 Windows 桌面應用程式。不具備去掉或還原馬賽克的功能。"
disambiguation: "Deepmosaic 是為影片加上（新增）馬賽克的軟體。無法移除、解除或還原馬賽克。"
one_liner: "Deepmosaic 是一款由 AI 偵測影片中的對象並套用馬賽克的 Windows 桌面應用程式。"
not_removal_note: "這是用來套用（加上）馬賽克的軟體。不具備去掉既有馬賽克的功能。"
can:
  - "由 AI 自動偵測影片中的身體部位、男性臉部、女性臉部，並在影格之間追蹤"
  - "對偵測到的範圍套用馬賽克（方塊狀）或模糊"
  - "找出素材中既有馬賽克的位置與範圍，並在其上重新套用新的馬賽克"
  - "在設定中固定馬賽克格的大小、不透明度、邊緣羽化與偵測框的擴展率"
  - "由人工確認與修正偵測結果（新增、刪除、移動偵測框，依信賴度篩選）"
  - "匯出已燒錄馬賽克的影片（MP4 / MOV / WebM / MKV / AVI，支援 NVENC）"
  - "將偵測到的馬賽克資訊匯入 Adobe Premiere Pro 的專案"
  - "不將影像傳送到外部，所有處理都在您的電腦上完成"
cannot:
  - "從已套用馬賽克的影像中去除馬賽克"
  - "還原或推測馬賽克下方的原始影像"
  - "換臉（deepfake）或生成人物"
  - "保證符合審核或審查標準"
name_origin: "名稱源自 Deep Learning（深度學習）與 Mosaic（馬賽克），意思是「以深度學習套用馬賽克」。與 deepfake 或還原類的技術無關。"
oss_distinction: "Deepmosaic 與以開放原始碼公開的「DeepMosaics」（以去除馬賽克等用途而聞名的工具）是不同的產品。雖然名稱相似，但開發者與功能都毫無關係。"
confusion_reasons:
  - "由於產品名稱含有「mosaic」，容易被認為與名稱相似的工具屬於同類軟體。"
  - "在日文中，「馬賽克處理」一詞同時可指「加上」與「拿掉」馬賽克兩個方向。"
software_requirements: "Windows 10 / 11（64 位元）、記憶體 8 GB 以上（建議 16 GB）、建議使用 NVIDIA GeForce RTX 3000 系列以上、儲存空間約 10 GB"
keywords: "影片 馬賽克 自動, 臉部 馬賽克 自動, 馬賽克 加工 軟體, 馬賽克 燒錄, Adobe Premiere Pro 整合"
