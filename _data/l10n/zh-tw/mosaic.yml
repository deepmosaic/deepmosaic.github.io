# T-2202 (i18n1112 I18N-704): `_data/mosaic.yml` (モザイクの設定の表) の繁体字中国語 (台湾) の文だけ。ja と同じ入れ子・同じ件数・同じ順。
# val の中の <strong> と priority_note の &gt; (実体参照) はそのまま残す。数値 (粒の数・範囲・倍率・%・px) は ja と同じ。
# アプリの画面の名前 (「ピクセルサイズを設定」・ピクセルサイズ自動・最も粗い粒) は W8 でアプリの辞書と突き合わせる (notes_T-2202.md)。
# ja を直したら訳も直し、accept-site.mjs で hash を書き直す。
_source: "_data/mosaic.yml"
_source_hash: "102769e16c79eb665fe8eb7d27d9d775981a653be925a409195adecad2284bd3"
scopes:
  - key: "全部"
    val: "整個專案的預設值"
  - key: "依類別"
    val: "依偵測類別設定，例如身體部位、男性臉部、女性臉部"
  - key: "依 ID"
    val: "依每個被追蹤的對象設定"
  - key: "依場景"
    val: "以鏡頭為單位"
priority_note: "優先順序為依 ID &gt; 依類別 &gt; 依場景 &gt; 全部。範圍越小的設定越優先。正在覆寫的範圍會顯示標示，並可個別清除。"
controls:
  - key: "像素大小"
    val: "在「設定像素大小」畫面中，一邊查看預覽與圖表一邊決定。馬賽克格的大小以<strong>畫面寬度上排列的格數</strong>來代表，因此即使影片的解析度不同，看起來也一樣。<strong>固定</strong>（預設為寬度 53 格）會讓所有對象使用相同的馬賽克格。開啟<strong>自動像素大小</strong>後，即可依對象的大小改變馬賽克格。"
  - key: "依大小範圍"
    val: "依對象大小（相對於畫面寬度的比例）的範圍，分別決定寬度上排列的格數（1～6 個範圍）。在同一鏡頭內、同一 ID 內，馬賽克格的大小保持一致。"
  - key: "依分割數等比"
    val: "以對象大小除以分割數（8～64）的值作為馬賽克格的大小。可用「最粗的馬賽克格」（寬度 N 格以上）限制粗細的上限。在同一鏡頭內、同一 ID 內，馬賽克格的大小保持一致。"
  - key: "大小（框擴展比例）"
    val: "從中心放大或縮小偵測框，以調整馬賽克範圍（0.5x～2x）。可選擇不貼著邊緣、保留餘裕的做法。"
  - key: "類型、不透明度、邊緣羽化"
    val: "切換馬賽克（方塊狀）/ 模糊（高斯模糊）、不透明度（0～100%，預設 100% 為完全覆蓋）、邊緣羽化（0～64 px）"
  - key: "信賴度臨界值"
    val: "僅顯示信賴度達指定值以上的偵測結果，並套用馬賽克（0～100%）。"
  - key: "銳利色彩"
    val: "馬賽克格的顏色不取區域平均，而改用 1 個點取樣（相當於 Premiere Pro 的 Sharp Colors，預設關閉）。"
note: "各項設定可用該項目右端的按鈕恢復為預設值。面板可拖曳到任意位置，並可在開啟的狀態下繼續編輯。"
