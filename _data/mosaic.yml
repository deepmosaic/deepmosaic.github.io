# モザイク設定 (TICKET-SITE-03)
#
# Claude Design の成果物には「審査基準準拠プリセット」(標準 / 高隠蔽 / カスタム を
# タブで切り替える表) があったが、**プリセットの保存・切替機能は未実装**
# (成長戦略ドキュメントの実行順序 #14)。実装していない機能を「提供します」と
# 書くのは施策④-4 (誇大表示の回避) に反するため、**実際に実装されている設定項目**を
# 説明する形に縮小した。
#
# 出典: docs/index.html の「モザイク設定パネル」節 (実アプリのキャプチャに基づく)。
# 実装が変わったらここと docs の両方を直すこと。

# 適用範囲。狭い範囲の設定が優先される (front `edit-state` の解決順と一致)。
scopes:
  - key: "全て"
    val: "プロジェクト全体の既定値"
  - key: "クラス別"
    val: "局部・男性顔・女性顔など、検出クラスごと"
  - key: "ID別"
    val: "追跡された個々の対象ごと"
  - key: "シーン別"
    val: "カット単位"
priority_note: "優先順位は ID別 &gt; クラス別 &gt; シーン別 &gt; 全て。狭い範囲の設定が優先されます。オーバライド中の範囲には表示が出て、個別にクリアできます。"

# 粒度・隠蔽率に関わる設定項目。
controls:
  - key: "ピクセルサイズ自動"
    val: "対象物のサイズに連動してモザイクの粒を自動計算します（既定 ON）。<strong>カット内・同一 ID 内で粒度は一定</strong>になるため、フレームごとにちらつきません。「細かさ」と最小 / 最大セル (px) で調整できます"
  - key: "ブロック分割数"
    val: "自動 OFF のとき、領域を縦横に何分割するかで粗さを固定します（8〜64）。Adobe Premiere Pro と同じ方式なので、既存の運用値をそのまま持ち込めます"
  - key: "サイズ（bbox 拡張率）"
    val: "検出枠を中心から拡大・縮小してモザイク範囲を調整します（0.5x〜2x）。ギリギリを狙わない運用を選べます"
  - key: "種類・不透明度・エッジぼかし"
    # TICKET-SITE-30: 「濃さ」→「不透明度」。docs のモザイク設定パネルの説明と
    # 語を揃える (同じ設定を 2 箇所で説明しているため)。
    val: "モザイク（ブロック状）/ ぼかし（ガウスぼかし）の切替、不透明度（0〜100%・既定 100% で完全に覆う）、ふちのなじませ（0〜64px）"
  - key: "信頼度しきい値"
    val: "指定した信頼度以上の検出だけを表示・モザイク対象にします（0〜100%）"
  - key: "シャープカラー"
    val: "粒の色を領域平均ではなく 1 点サンプリングにします（Premiere Pro の Sharp Colors 相当、既定 OFF）"

# 提出先ごとに設定を保存して切り替える機能は未実装。**「予定」と書かず、
# 現状できることだけを書く。**
note: "設定は各項目の右端のボタンで既定値に戻せます。パネルはドラッグで自由な位置に移動でき、開いたまま編集を続けられます。"
