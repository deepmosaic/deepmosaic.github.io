# モザイク設定の表のデータ。アプリに実装されている設定項目だけを書く。
# 出典: docs/index.html の「モザイク設定パネル」節。実装が変わったらここと docs の両方を直すこと。

# 適用範囲。狭い範囲の設定が優先される (アプリの解決順と一致)。
scopes:
  - key: "全て"
    val: "プロジェクト全体の既定値"
  - key: "クラス別"
    val: "局部・男性顔・女性顔など、検出クラスごと"
  - key: "ID別"
    val: "追跡された個々の対象ごと"
  - key: "シーン別"
    val: "カット単位"
priority_note: "優先順位は ID別 &gt; クラス別 &gt; シーン別 &gt; 全て。狭い範囲の設定が優先されます。オーバライド中の範囲には表示が出て、個別にクリアできます。"

# 粒度・隠蔽率に関わる設定項目。
controls:
  # 3 モード (固定 / 自動 / 手動) は「ピクセルサイズを設定」の画面で決める。領域の幅で割る方式は書かない
  # (Premiere Pro と同じ方式とは書かない)。
  # 粒の大きさは「画面の幅に並ぶ粒の数」で表す (px と解像度は書かない。動画の解像度が違っても同じ見た目)。
  - key: "ピクセルサイズ"
    val: "「ピクセルサイズを設定」の画面で、プレビューとグラフを見ながら決めます。粒の大きさは<strong>画面の幅に並ぶ粒の数</strong>で表すので、動画の解像度が違っても同じ見た目になります。<strong>固定</strong>（既定は幅に 53 粒）はすべての対象で同じ粒です。<strong>ピクセルサイズ自動</strong>を ON にすると、対象物の大きさで粒を変えられます"
  - key: "大きさの範囲ごと"
    val: "対象物の大きさ（画面幅に対する割合）の範囲ごとに、幅に並ぶ粒の数を決めます（1〜6 範囲）。カット内・同一 ID 内で粒度は一定です"
  - key: "分割数で比例"
    val: "対象物の大きさを分割数（8〜64）で割った粒にします。「最も粗い粒」（幅に N 粒以上）で粗さの限度を付けられます。カット内・同一 ID 内で粒度は一定です"
  - key: "サイズ（bbox 拡張率）"
    val: "検出枠を中心から拡大・縮小してモザイク範囲を調整します（0.5x〜2x）。ギリギリを狙わない運用を選べます"
  - key: "種類・不透明度・エッジぼかし"
    # 語は「不透明度」(「濃さ」と書かない)。docs のモザイク設定パネルの説明と
    # 語を揃える (同じ設定を 2 箇所で説明しているため)。
    val: "モザイク（ブロック状）/ ぼかし（ガウスぼかし）の切替、不透明度（0〜100%・既定 100% で完全に覆う）、ふちのなじませ（0〜64px）"
  - key: "信頼度しきい値"
    val: "指定した信頼度以上の検出だけを表示・モザイク対象にします（0〜100%）"
  - key: "シャープカラー"
    val: "粒の色を領域平均ではなく 1 点サンプリングにします（Premiere Pro の Sharp Colors 相当、既定 OFF）"

# 今できることだけを書く (「予定」と書かない)。
note: "設定は各項目の右端のボタンで既定値に戻せます。パネルはドラッグで自由な位置に移動でき、開いたまま編集を続けられます。"
