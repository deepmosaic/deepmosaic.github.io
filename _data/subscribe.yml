# 申し込みページ `/subscribe/` の文言と設定 (T-1922、2026-11-11)。
#
# ユーザー決定 2026-11-11「案 B」: サイトに専用の申し込みページを作り、Stripe の決済へ (アカウントとの紐付けあり)。
# T-2306 (backlog1113): 2.14 はサイト配布版 (インストーラ) と Microsoft Store 版の両方で出す。
# 申し込みは「アプリのプロフィールメニュー (Windows 版をダウンロードしてお使いの方)、またはこのページから Web 版のアカウントで」。
# どちらで申し込んでも同じアカウントで Desktop 版と Web 版の両方に効く。Store 版のアプリは購入画面を出さずこのページを案内する
# (desktop T-1898 → T-1922、`src/lib/links.ts` の `SUBSCRIBE_URL`) ので、Store 版の利用者のためにページは残す。
# Store 版についての文 (`store_note`) と FAQ (`store_only: true` の項目) は `_data/site.yml` の `distribution.store_enabled` が
# true のときだけ出る (`_includes/store-subscribe-note.html`・`_includes/faq.html`・`_includes/schema/faq.html` が判断する)。
#
# プランごとのボタンは Web 版の深いリンク `<site.web_app.url>?<checkout_query>=<plan code>` を指す。
# Web 版 (web リポの `app/src/lib/billing/checkout-deeplink.ts`) が受け、ログイン済みならその Stripe Checkout を開き、
# 未ログインならログイン後に同じ URL へ戻して続ける。**クエリ名を変えるときは Web 版と同時に。**
# ボタンを出すプランは `_data/plans.yml` で `subscribe` を持つもの (self_serve のプラン = Light / Pro)。

checkout_query: "checkout"

# Store 版についての 1 文 (ページの冒頭の段落の下。store_enabled が true のときだけ、`_includes/store-subscribe-note.html`)。
store_note: "Microsoft Store 版のアプリには購入画面がありません。Microsoft Store 版をお使いの方は、このページからお申し込みください（アプリと同じアカウントでサインインすると、そのままアプリでご利用いただけます）。"

# FAQ (表示と FAQPage JSON-LD を同じデータから作る。`_includes/schema/faq.html` が page.faq_data で読む)。
# 回答は `_includes/faq-answer.html` を通る (プレースホルダは使っていない)。
# `store_only: true` の項目は store_enabled が true のときだけ出る (表示と JSON-LD が同じ条件で外す)。英中の訳も同じ位置に付ける。
faq:
  - q: "アプリから申し込めますか？"
    a: "はい。Windows 版をダウンロードしてお使いの方は、アプリの画面右上のプロフィールメニューから申し込めます。このページのボタンから、Web 版（ブラウザ）でアカウントにサインインして申し込むこともできます。どちらで申し込んでも、同じアカウントで Desktop 版と Web 版の両方で有料プランをご利用いただけます。"
  - q: "Microsoft Store 版のアプリで申し込めますか？"
    store_only: true
    a: "Microsoft Store 版のアプリには購入画面がありません。有料プランのお申し込みはこのページのボタンから、Web 版（ブラウザ）でアカウントにサインインして行います。お手続きが終わったら、アプリで同じアカウントにサインインするとそのまま有料プランをご利用いただけます。"
  - q: "アプリと同じアカウントで申し込む必要がありますか？"
    a: "はい。プランはアカウント（メールアドレス）に紐づきます。アプリでお使いのアカウントでサインインしてお申し込みください。まだアカウントをお持ちでない場合も、サインイン画面の「サインイン」から作成できます（メールに届く確認コードでサインインすると、アカウントが自動で作成されます）。"
  - q: "プランの変更や解約はどこで行いますか？"
    a: "Web 版にサインインし、画面右上のプロフィールメニューの「プラン管理」から行います（お支払い方法の変更も同じ画面です。Windows 版をダウンロードしてお使いの方は、アプリのプロフィールメニューの「プラン管理」からも行えます）。解約後も、お支払い済みの契約期間の末日まで有料プランをご利用いただけます。"
