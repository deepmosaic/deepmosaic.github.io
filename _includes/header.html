{%- capture contact_url -%}https://docs.google.com/forms/d/e/1FAIpQLSedhPxi0r55_iIp8d02qKiFVSG-91P0qib0U6ayKpACw0NLzg/viewform?usp=sf_link{%- endcapture -%}
{%- assign u = page.url -%}
<header class="sticky top-0 z-50 border-b border-hair bg-[rgba(31,31,31,0.85)] backdrop-blur-md">
  <div class="mx-auto flex h-[60px] w-[92%] max-w-[1120px] items-center gap-7">

    <a href="/" class="flex items-center">
      <img src="/assets/img/logo-font-cropped.png" alt="Deepmosaic" width="189" height="36" class="h-[26px] w-auto">
    </a>

    <!-- Desktop nav -->
    <nav class="ml-3 hidden gap-1 md:flex">
      <a href="/" class="rounded-md px-3 py-1.5 text-sm {% if u == '/' %}bg-hair text-ink{% else %}text-ink-2 hover:text-ink{% endif %}">ホーム</a>
      <a href="/price" class="rounded-md px-3 py-1.5 text-sm {% if u contains '/price' %}bg-hair text-ink{% else %}text-ink-2 hover:text-ink{% endif %}">料金</a>
      <a href="/docs" class="rounded-md px-3 py-1.5 text-sm {% if u contains '/docs' %}bg-hair text-ink{% else %}text-ink-2 hover:text-ink{% endif %}">ドキュメント</a>
    </nav>

    <div class="flex-1"></div>

    <!-- Desktop download CTA -->
    <a href="{{ site.data.lang.ja.app_download_link }}" download class="btn-primary hidden md:inline-flex">
      {% include icon.html name="Download" class="h-4 w-4" %}無料でダウンロード
    </a>

    <!-- Mobile nav (Svelte island + noscript fallback) -->
    <div class="md:hidden">
      <div data-island="mobile-nav" data-edge="right"
           data-links='[{"label":"ダウンロード","href":"{{ site.data.lang.ja.app_download_link }}","download":true},{"label":"ホーム","href":"/"},{"label":"料金","href":"/price"},{"label":"ドキュメント","href":"/docs"},{"label":"問い合わせ","href":"{{ contact_url }}","target":"_blank"}]'></div>
      <noscript>
        <nav class="flex flex-col items-end gap-1 text-sm">
          <a href="/" class="px-2 py-1 text-ink-2 hover:text-ink">ホーム</a>
          <a href="/price" class="px-2 py-1 text-ink-2 hover:text-ink">料金</a>
          <a href="/docs" class="px-2 py-1 text-ink-2 hover:text-ink">ドキュメント</a>
        </nav>
      </noscript>
    </div>

  </div>
</header>
