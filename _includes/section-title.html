<div class="mb-12 text-center">
  {% if include.kicker %}<div class="kicker mb-2.5">{{ include.kicker }}</div>{% endif %}
  <h2 class="text-3xl font-bold tracking-[-0.01em] text-ink sm:text-[34px]">{{ include.title }}</h2>
  {% if include.sub %}<p class="mx-auto mt-3.5 max-w-[640px] text-[15.5px] leading-[1.9] text-ink-2">{{ include.sub }}</p>{% endif %}
</div>
