<div class="mb-12 {% if include.align == 'left' %}text-left{% else %}text-center{% endif %}">
  {% if include.kicker %}<div class="kicker mb-2.5">{{ include.kicker }}</div>{% endif %}
  <h2 class="text-3xl font-bold tracking-[-0.01em] text-ink sm:text-[34px]">{{ include.title }}</h2>
  {% if include.sub %}<p class="{% unless include.align == 'left' %}mx-auto {% endunless %}mt-3.5 max-w-[640px] text-[15.5px] leading-[1.9] text-ink-2">{{ include.sub }}</p>{% endif %}
</div>
