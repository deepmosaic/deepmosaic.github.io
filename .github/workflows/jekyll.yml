name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Build front-end assets (Tailwind CSS v4 + Svelte islands) into assets/dist/
      # BEFORE Jekyll runs, so `jekyll build` sweeps them into _site.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS deps
        run: npm ci

      # 料金計算の回帰テスト (TICKET-SITE-20)。`_data/plans.yml` の実データを読むので、
      # 料金カードの表示と ROI 計算機が食い違ったまま公開されるのを止められる。
      - name: Test
        run: npm test

      - name: Build front-end assets (Vite)
        run: npm run build

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        run: bundle exec jekyll build --strict_front_matter --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # TICKET-SITE-36: ビルド出力に対する回帰ガード。
      #
      # 1) 素通しファイル (robots.txt / llms.txt / llms-full.txt) の HTML 化検知。
      #    `_config.yml` の defaults が全ページに `layout: default` を当てるため、
      #    front matter の `layout: null` を落とすと Jekyll がこれらを HTML でラップして
      #    配信する。TICKET-SITE-15 で robots.txt が実際にこれを踏んでいる。
      #    ビルドは成功するので、検査しないと無言で壊れる類のバグ。
      #
      # 2) 誤認訂正の文言が消えていないこと。「Deepmosaic はモザイクを *除去* する
      #    ソフト」という誤認の是正 (TICKET-SITE-24〜36) が、後のコピー変更で
      #    無言で巻き戻るのを防ぐ。
      #
      # 3) 料金データが Supabase `plan_catalog` とずれていないこと
      #    (TICKET-SITE-CONTRACT-SSOT / 案B)。契約本数の上限・込み時間・月額の
      #    **真の SSOT は Supabase**。静的サイトは Supabase を読めないので
      #    `_data/plans.yml` に写しを置いており、乖離すると**実在しない契約条件を
      #    広告する**。人手のレビューに頼らず機械で気付く。
      #
      #    ⚠️ **デプロイを Supabase / Worker の可用性に人質に取らせない。**
      #    シークレット未設定・ネットワーク断・5xx・鍵が無効のときは `::warning::` を
      #    出して素通しする (`scripts/check-plan-catalog.mjs` が exit 0)。落ちるのは
      #    「取得に成功して値が食い違ったとき」だけ。`|| fail=1` で受けているのは、
      #    ずれを検知しても他の検査結果をまとめて出してから終わらせるため。
      - name: Verify build output
        env:
          # 未登録なら空文字が渡り、スクリプト側が skip する (CI は緑のまま)
          SUPABASE_PROXY_API_KEY: ${{ secrets.SUPABASE_PROXY_API_KEY }}
        run: |
          set -euo pipefail
          fail=0
          for f in robots.txt llms.txt llms-full.txt; do
            if [ ! -f "_site/$f" ]; then
              echo "::error::_site/$f が生成されていない"; fail=1; continue
            fi
            if head -c 400 "_site/$f" | grep -qiE '<!doctype|<html'; then
              echo "::error::_site/$f が HTML でラップされている — front matter の layout: null を確認すること"; fail=1
            fi
          done
          head -1 _site/llms.txt | grep -q '^# Deepmosaic' \
            || { echo "::error::llms.txt の H1 が失われている"; fail=1; }
          grep -q '^Sitemap: ' _site/robots.txt \
            || { echo "::error::robots.txt の Sitemap 行が失われている"; fail=1; }
          grep -qE '<br>|<strong>|&gt;|&lt;' _site/llms-full.txt \
            && { echo "::error::llms-full.txt に HTML / 実体参照が残っている — strip_html と実体参照デコードの順序を確認すること"; fail=1; } || true
          grep -q 'モザイクをかける' _site/index.html \
            || { echo "::error::トップページから製品の方向を示す文言が消えている"; fail=1; }
          grep -q '取り除く機能はありません' _site/index.html \
            || { echo "::error::トップページから誤認訂正の注記が消えている"; fail=1; }
          grep -q 'disambiguatingDescription' _site/index.html \
            || { echo "::error::JSON-LD の disambiguatingDescription が消えている"; fail=1; }
          [ -f _site/mosaic-removal/index.html ] \
            || { echo "::error::/mosaic-removal/ が生成されていない"; fail=1; }
          # プレースホルダの漏れ (TICKET-SITE-CONTRACT-SSOT)。
          # `_data/faq.yml` の回答は `%%LIGHT_MAX%%` 等を持ち、置換は `_includes/faq-answer.html`
          # だけが行う。**この include を通さない消費者が新たに増えると生のまま公開面に出る**
          # (実際この作業中に llms-full.txt が一度踏んでいる)。しかも FAQ は FAQPage の
          # JSON-LD として検索結果にも出るので、目視レビューでは間に合わない。
          if grep -rl '%%[A-Z_]\{1,\}%%' _site >/dev/null 2>&1; then
            echo "::error::置換されていないプレースホルダが出力に残っている — _includes/faq-answer.html を通していない箇所がある"
            grep -rn '%%[A-Z_]\{1,\}%%' _site | head -20
            fail=1
          fi
          # 表示 FAQ と FAQPage JSON-LD の件数一致 (同一データ源なので必ず一致するはず)
          # `set -euo pipefail` 下では grep が 0 件で exit 1 を返し、pipefail 経由で
          # **代入コマンドごとスクリプトが落ちる**。落ちてほしいのは事実だが、それだと
          # 「何がどう消えたか」の診断が出ないまま生の shell エラーになる。`|| true` で
          # 件数を受け取り、判定とメッセージはこちらで出す。
          d=$(grep -o '<details' _site/index.html | wc -l || true)
          q=$(grep -o '"@type": "Question"' _site/index.html | wc -l || true)
          [ "$d" -eq "$q" ] \
            || { echo "::error::FAQ の表示件数 ($d) と FAQPage JSON-LD の件数 ($q) が食い違っている"; fail=1; }
          # DL 計測 (TICKET-SITE-37)。`data-dl` が付いていない DL リンクは計測から漏れる。
          # クリックできる <a> の数と data-dl の数が一致するはず — 差分は
          # JSON-LD の downloadUrl と data-links (Svelte が描画する分) だけ。
          for p in index.html price/index.html spec/index.html; do
            a=$(grep -o 'data-dl="' "_site/$p" | wc -l || true)
            [ "$a" -gt 0 ] \
              || { echo "::error::_site/$p の DL ボタンから data-dl が消えている — 計測が止まる"; fail=1; }
          done
          grep -q 'data-dl' _site/assets/dist/app.js \
            || { echo "::error::バンドルから DL 計測の配線が消えている"; fail=1; }
          # utm を素の href に焼き込んでいないこと (全訪問者とクローラに同じ utm が配られる)
          grep -q 'download/latest/windows?' _site/index.html \
            && { echo "::error::DL リンクの href に直接クエリが焼き込まれている — 装飾は実行時に行うこと"; fail=1; } || true
          # _data/plans.yml と Supabase plan_catalog の突き合わせ (取得できなければ skip)
          node scripts/check-plan-catalog.mjs || fail=1
          exit $fail

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
